<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEDARION - Advanced LSAT Preparation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #0A0A0A;
        }
        
        /* Nav */
        .nav {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 50px;
        }
        
        .nav-brand {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 4px;
            color: white;
            text-decoration: none;
        }
        
        .nav-brand .v-accent {
            color: #C65D3B;
            font-weight: 700;
        }
        
        .nav-links {
            display: flex;
            gap: 40px;
        }
        
        .nav-links a {
            color: #888;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }
        
        .nav-links a:hover {
            color: white;
        }
        
        /* Hero Section */
        .hero {
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 120px 20px 60px;
        }
        
        .hero-brand {
            font-size: 72px;
            font-weight: 300;
            letter-spacing: 12px;
            margin-bottom: 30px;
        }
        
        .hero-brand .v-accent {
            color: #C65D3B;
            font-weight: 700;
        }
        
        .hero-tagline {
            font-size: 20px;
            color: #B0B0B0;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        
        .hero-description {
            font-size: 18px;
            color: #888;
            max-width: 700px;
            margin: 0 auto 40px;
            line-height: 1.8;
        }
        
        /* Video */
        .video-container {
            max-width: 300px;
            margin: 0 auto 40px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        
        .video-container iframe {
            width: 100%;
            aspect-ratio: 9/16;
            border: none;
        }
        
        .cta-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        
        .cta-button {
            background: #C65D3B;
            color: white;
            padding: 18px 50px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .cta-button:hover {
            background: #A04D2E;
            transform: translateY(-2px);
        }
        
        .cta-subtext {
            font-size: 15px;
            color: #888;
            font-style: italic;
            letter-spacing: 0.5px;
        }
        
        /* Footer */
        .footer {
            background: #0A0A0A;
            border-top: 1px solid #222;
            color: #555;
            text-align: center;
            padding: 30px 20px;
            font-size: 13px;
        }
        
        .footer a {
            color: #C65D3B;
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        /* Mobile responsive */
        @media (max-width: 768px) {
            .nav {
                padding: 20px;
                flex-direction: column;
                gap: 20px;
            }
            
            .nav-links {
                gap: 25px;
            }
            
            .hero {
                padding: 100px 20px 40px;
            }
            
            .hero-brand {
                font-size: 48px;
                letter-spacing: 6px;
            }
            
            .hero-tagline {
                font-size: 16px;
            }
            
            .hero-description {
                font-size: 16px;
            }
            
            .video-container {
                max-width: 260px;
            }
        }
    </style>
</head>
<body>
    <!-- Nav -->
    <nav class="nav">
        <a href="index.html" class="nav-brand"><span class="v-accent">V</span>EDARION</a>
        <div class="nav-links">
            <a href="about.html">About</a>
            <a href="pricing.html">Pricing</a>
            <a href="learn.html">Learn</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1 class="hero-brand"><span class="v-accent">V</span>EDARION</h1>
        <p class="hero-tagline">Advanced strategies. Smarter preparation.</p>
        <p class="hero-description">
            Master the LSAT through pattern recognition.
        </p>
        
        <!-- Video -->
        <div class="video-container">
            <iframe 
                src="https://www.youtube.com/embed/CcdsMjdUP-M" 
                title="Meet Rahela - VEDARION"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>
        
        <div class="cta-container">
            <a href="https://calendly.com/vedarion-tutoring/free-15min-lsatgameplancall" class="cta-button">Book a Free 15-Min Consultation</a>
            <p class="cta-subtext">Let's map your path to a 170+.</p>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>Questions? <a href="mailto:vedarion.tutoring@gmail.com">vedarion.tutoring@gmail.com</a></p>
    </footer>
</body>
</html>
