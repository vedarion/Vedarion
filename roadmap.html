<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEDARION — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#080808;--surface:#0c0c0c;--border:#151515;--border-hi:#252525;
      --input:#0a0a0a;--text:#d4d4d4;--bright:#eaeaea;--dim:#777;--muted:#555;
      --faint:#333;--deep:#1a1a1a;--accent:#c97a45;--green:#5cb85c;
      --green-bg:rgba(92,184,92,.08);--red:#d9534f;
      --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;
      --serif:'Libre Baskerville',Georgia,serif;
    }
    body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#1a1a1a;border-radius:2px}
    select option{background:#111;color:#bbb}

    .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:radial-gradient(ellipse at 50% 30%,rgba(201,122,69,.03) 0%,transparent 60%)}
    .login-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:48px 40px;width:100%;max-width:380px;animation:fadeUp .5s ease;box-shadow:0 32px 64px rgba(0,0,0,.4)}
    .logo{font-family:var(--mono);font-weight:700;letter-spacing:4px}.logo .v{color:var(--accent)}.logo .rest{color:var(--bright)}
    .login-box .logo{font-size:20px;text-align:center;margin-bottom:40px}
    .lbl{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:block}
    .inp{width:100%;padding:14px 16px;background:var(--input);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--sans);font-size:14px;outline:none;margin-bottom:20px;transition:border-color .2s}
    .inp:focus{border-color:#2a2a2a}.inp::placeholder{color:var(--faint)}
    .btn-primary{width:100%;padding:14px;background:var(--deep);border:1px solid #222;border-radius:10px;color:var(--bright);font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.5px;cursor:pointer;transition:all .2s}
    .btn-primary:hover{background:#222;border-color:#333}.btn-primary:disabled{opacity:.4;cursor:not-allowed}
    .login-err{color:var(--red);font-size:12px;text-align:center;margin-top:14px}
    .forgot{text-align:center;margin-top:16px}.forgot a{color:var(--faint);font-size:11px;font-family:var(--mono);text-decoration:none;transition:color .2s}.forgot a:hover{color:var(--muted)}

    .nav{padding:16px 32px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(8,8,8,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:100}
    .nav-left{display:flex;align-items:center;gap:12px}.nav .logo{font-size:14px}
    .nav-sep{color:#1a1a1a;font-size:14px}.nav-role{color:var(--text);font-size:11px;font-family:var(--mono);letter-spacing:.5px}
    .nav-links{display:flex;align-items:center;gap:2px}
    .nav-link{padding:6px 14px;color:var(--bright);font-family:var(--mono);font-size:12px;text-decoration:none;border-radius:6px;transition:all .2s;letter-spacing:.5px}
    .nav-link:hover{color:#fff;background:rgba(255,255,255,.04)}
    .nav-right{display:flex;align-items:center;gap:14px}
    .nav-user{color:var(--faint);font-size:11px;font-family:var(--mono)}
    .sign-out{padding:6px 14px;background:transparent;border:1px solid var(--border-hi);border-radius:7px;color:var(--text);font-family:var(--mono);font-size:10px;cursor:pointer;transition:all .2s;letter-spacing:.3px}
    .sign-out:hover{border-color:var(--dim);color:var(--bright)}

    .layout{display:flex;max-width:1080px;margin:0 auto;padding:32px;gap:28px;animation:fadeUp .4s ease}
    .main{flex:1;min-width:0}.sidebar{width:230px;flex-shrink:0}

    .sb-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;position:sticky;top:90px}
    .sb-title{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--faint);margin-bottom:16px}
    .sb-list{display:flex;flex-direction:column;gap:3px;margin-bottom:18px}
    .sb-item{padding:10px 12px;border-radius:10px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:12px;border:1px solid transparent}
    .sb-item:hover{background:rgba(255,255,255,.02)}.sb-item.active{background:rgba(255,255,255,.03);border-color:var(--border-hi)}
    .sb-avatar{width:34px;height:34px;border-radius:9px;background:var(--deep);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--faint);flex-shrink:0;transition:color .15s}
    .sb-item.active .sb-avatar{color:var(--text)}
    .sb-sname{font-size:13px;color:var(--dim);font-weight:500;transition:color .15s}.sb-item.active .sb-sname{color:var(--bright)}
    .sb-spack{font-size:9px;color:var(--muted);font-family:var(--mono);letter-spacing:.5px;margin-top:1px}
    .sb-divider{height:1px;background:var(--border);margin:14px 0}
    .sb-add-title{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
    .sb-add-input{width:100%;padding:10px 12px;background:var(--input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-family:var(--sans);outline:none;margin-bottom:8px;transition:border-color .2s}
    .sb-add-input:focus{border-color:#2a2a2a}.sb-add-input::placeholder{color:var(--faint)}
    .sb-add-btn{width:100%;padding:9px;background:var(--deep);border:1px solid #222;border-radius:8px;color:var(--dim);font-family:var(--mono);font-size:10px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.3px}
    .sb-add-btn:hover{background:#222;color:var(--text)}.sb-add-btn:disabled{opacity:.4;cursor:not-allowed}
    .sb-tpl-sel,.tpl-apply-sel{width:100%;padding:9px;border-radius:8px;border:1px solid var(--border);background:var(--deep);color:var(--dim);cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.3px;outline:none;transition:all .2s;-webkit-appearance:none;appearance:none}
    .sb-tpl-sel:hover,.tpl-apply-sel:hover{border-color:var(--faint);color:var(--text)}
    .sb-msg{font-size:11px;margin-top:8px;font-family:var(--sans);line-height:1.4}.sb-msg.err{color:var(--red)}.sb-msg.ok{color:var(--green)}
    .sb-empty{color:var(--faint);font-size:11px;text-align:center;padding:20px 0;font-family:var(--mono)}
    .sb-archive-toggle{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;transition:all .2s;color:var(--bright);font-family:var(--mono);font-size:10px;letter-spacing:.5px;border:1px solid var(--border-hi);border-radius:8px;background:var(--deep);margin-top:6px}
    .sb-archive-toggle:hover{border-color:var(--faint);background:rgba(255,255,255,.03);color:#fff}
    .sb-archive-toggle svg{transition:transform .2s;stroke:var(--bright)}
    .sb-archive-toggle.open svg{transform:rotate(90deg)}
    .sb-archive-count{background:rgba(201,122,69,.12);border:1px solid rgba(201,122,69,.25);border-radius:4px;padding:1px 7px;font-size:9px;color:var(--accent)}
    .sb-archived-list{display:flex;flex-direction:column;gap:2px;padding:4px 0}
    .sb-archived-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:8px;transition:all .15s}
    .sb-archived-item:hover{background:rgba(255,255,255,.04)}
    .sb-archived-name{font-size:13px;color:var(--bright);font-family:var(--sans)}
    .sb-restore-btn{background:rgba(201,122,69,.1);border:1px solid rgba(201,122,69,.25);color:var(--accent);font-family:var(--mono);font-size:9px;cursor:pointer;padding:3px 10px;border-radius:5px;transition:all .15s;letter-spacing:.3px;font-weight:600}
    .sb-restore-btn:hover{background:rgba(201,122,69,.2);border-color:var(--accent)}

    .profile{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:30px;margin-bottom:12px}
    .profile-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px}
    .p-name{font-size:28px;font-weight:700;font-family:var(--serif);color:var(--bright);line-height:1.2}
    .p-pkg{margin-top:6px;color:var(--dim);font-size:12px;font-family:var(--mono);letter-spacing:.5px}
    .p-goal-lbl{font-size:9px;color:var(--accent);font-family:var(--mono);font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
    .p-goal{font-size:36px;font-weight:700;font-family:var(--mono);color:var(--bright);line-height:1}
    .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:20px}
    .stat{background:var(--input);border:1px solid var(--border-hi);border-radius:10px;padding:14px 12px;text-align:center}
    .stat-lbl{font-size:9px;color:var(--dim);font-family:var(--mono);font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
    .stat-val{font-size:16px;font-weight:700;color:var(--bright);font-family:var(--mono)}
    .time-factor-sel{background:var(--deep);border:1px solid var(--border);border-radius:6px;color:var(--bright);font-family:var(--mono);font-size:14px;font-weight:700;padding:2px 6px;outline:none;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:center;width:100%}
    .time-factor-sel:hover{border-color:var(--faint)}
    .prog-wrap{margin-bottom:18px}.prog-top{display:flex;justify-content:space-between;margin-bottom:8px}
    .prog-lbl{font-size:9px;color:var(--accent);font-family:var(--mono);font-weight:600;letter-spacing:1.5px;text-transform:uppercase}
    .prog-ct{font-size:12px;color:var(--dim);font-family:var(--mono)}
    .prog-track{height:3px;background:#2a2a2a;border-radius:2px;overflow:hidden}
    .prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .6s ease}
    .info-grid{display:grid;grid-template-columns:1fr;gap:8px}
    .info-box{background:var(--input);border:1px solid var(--border-hi);border-radius:10px;padding:14px}
    .info-lbl{font-size:9px;color:var(--dim);font-family:var(--mono);font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
    .info-val{font-size:14px;color:var(--text);line-height:1.6}

    .ed{cursor:pointer;border-bottom:1px dashed rgba(255,255,255,.1);padding-bottom:1px;transition:border-color .2s}.ed:hover{border-color:rgba(255,255,255,.25)}
    .ed-inp{background:rgba(201,122,69,.06);border:1px solid rgba(201,122,69,.15);border-radius:6px;padding:4px 8px;outline:none;color:inherit;font:inherit;width:100%}
    .ed-inp[type="date"]{font-family:var(--mono);font-size:12px;color:var(--bright);padding:6px 10px;color-scheme:dark}
    .ed-inp[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.6);cursor:pointer}
    .ed-ta{background:rgba(201,122,69,.06);border:1px solid rgba(201,122,69,.15);border-radius:6px;padding:8px 10px;outline:none;color:inherit;font:inherit;width:100%;min-height:60px;resize:vertical}
    .ph{color:var(--muted);font-style:italic}

    .rm-header{display:flex;justify-content:space-between;align-items:baseline;margin:32px 0 16px}
    .rm-title{font-size:20px;font-family:var(--serif);font-weight:700;color:var(--text)}
    .rm-sub{font-size:11px;color:var(--dim);font-family:var(--mono);letter-spacing:.3px}
    .sess-list{display:flex;flex-direction:column;gap:6px}

    .sess{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:all .25s ease}
    .sess.up{border-color:var(--border-hi)}.sess.lk-s{opacity:.92}
    .sess-hd{padding:22px 26px;cursor:pointer;display:flex;align-items:center;gap:18px;user-select:none;transition:background .15s}
    .sess-hd:hover{background:rgba(255,255,255,.01)}
    .sess-num{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:15px;font-weight:700;flex-shrink:0}
    .sess-num.upcoming{background:#141414;border:1px solid rgba(201,122,69,.2);color:var(--bright)}
    .sess-num.completed{background:var(--green-bg);border:1px solid rgba(92,184,92,.1);color:var(--green)}
    .sess-num.locked{background:#0e0e0e;border:1px solid var(--border);color:var(--faint)}
    .sess-info{flex:1;min-width:0}.sess-tr{display:flex;align-items:center;gap:12px;margin-bottom:4px;flex-wrap:wrap}
    .sess-t{font-size:17px;font-weight:600;font-family:var(--serif);color:var(--bright)}
    .sess-t.lk{color:var(--text)}
    .sess-meta{font-size:13px;color:var(--text);display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sess-meta .sep{color:var(--faint)}
    .sess[draggable="true"] .sess-hd{cursor:grab}
    .sess[draggable="true"]:active .sess-hd{cursor:grabbing}
    .sess.drag-over-above{border-top:2px solid var(--accent);margin-top:-1px}
    .sess.drag-over-below{border-bottom:2px solid var(--accent);margin-bottom:-1px}
    .sess.dragging{opacity:.35}
    .reorder-btn{background:none;border:1px solid transparent;border-radius:4px;cursor:pointer;padding:2px;color:var(--faint);transition:all .15s;display:flex;align-items:center;justify-content:center}
    .reorder-btn:hover:not(:disabled){color:var(--accent);border-color:rgba(201,122,69,.2);background:rgba(201,122,69,.05)}
    .reorder-btn:disabled{opacity:.15;cursor:not-allowed}
    .chev{width:16px;height:16px;flex-shrink:0;transition:transform .3s ease;stroke:var(--faint)}.chev.open{transform:rotate(180deg)}
    .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:20px;font-size:9px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;font-family:var(--mono)}
    .badge.upcoming{background:var(--deep);color:var(--text)}.badge.completed{background:var(--green-bg);color:var(--green)}.badge.locked{background:#0e0e0e;color:var(--faint)}
    .bdot{width:5px;height:5px;border-radius:50%}.bdot.upcoming{background:var(--accent);animation:pulse 2s infinite}.bdot.completed{background:var(--green)}

    .sess-body{padding:0 26px 26px;border-top:1px solid var(--border);padding-top:20px}
    .tc{display:flex;gap:10px;margin-bottom:16px;align-items:center;padding:8px 14px;background:rgba(255,255,255,.015);border:1px solid var(--border);border-radius:9px}
    .tc-lbl{font-size:9px;color:var(--faint);font-family:var(--mono);font-weight:600;letter-spacing:1.5px}
    .tc-btn{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:6px;border:1px solid #222;background:var(--deep);color:var(--dim);cursor:pointer;font-size:9px;font-family:var(--mono);font-weight:600;margin-left:auto;transition:all .2s;letter-spacing:.5px}
    .tc-btn:hover{border-color:var(--faint);color:var(--text)}
    .slbl{color:var(--text);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-family:var(--mono);margin:0 0 14px}
    .slbl .lkn{color:var(--faint);font-weight:500;letter-spacing:1px}
    .desc{color:var(--text);font-size:15px;line-height:1.9;margin-bottom:24px}
    .g-list{display:flex;flex-direction:column;gap:9px;margin-bottom:24px}
    .g-item{display:flex;align-items:flex-start;gap:12px;color:var(--bright);font-size:15px;line-height:1.6}
    .g-arrow{color:var(--accent);flex-shrink:0;margin-top:2px;font-size:12px;opacity:.8}
    .goals-ta{width:100%;padding:12px 14px;background:rgba(18,16,14,.8);border:1px solid rgba(255,255,255,.06);border-radius:10px;color:var(--bright);font-size:15px;line-height:1.9;font-family:var(--sans);outline:none;resize:none;overflow:hidden;min-height:48px;transition:border-color .2s;margin-bottom:24px}
    .goals-ta:focus{border-color:rgba(201,122,69,.25)}
    .goals-ta::placeholder{color:var(--faint)}
    .rm-btn{background:none;border:none;color:var(--faint);cursor:pointer;font-size:14px;padding:0 4px;flex-shrink:0;line-height:1;transition:color .15s}.rm-btn:hover{color:var(--dim)}
    .add-b{background:none;border:1px dashed var(--border);border-radius:8px;color:var(--faint);cursor:pointer;padding:9px;font-size:10px;font-family:var(--mono);width:100%;transition:all .2s;letter-spacing:.3px}
    .add-b:hover{border-color:var(--faint);color:var(--muted)}
    .hw-list{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
    .hw{padding:14px 16px;background:rgba(18,16,14,.8);border-radius:10px;border:1px solid rgba(255,255,255,.06)}
    .hw.lk{background:rgba(8,8,8,.6);border:1px dashed var(--border)}
    .hw-top{display:flex;align-items:center;gap:14px}
    .hw-cb{width:15px;height:15px;border-radius:4px;border:1.5px solid #222;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
    .hw-cb:hover{border-color:var(--faint)}
    .hw-cb.checked{background:var(--accent);border-color:var(--accent);color:#fff}
    .hw-done .hw-l{text-decoration:line-through;opacity:.5}
    .hw-done .hw-desc{opacity:.65}
    .hw-l{color:var(--bright);font-size:15px;flex:1;line-height:1.4;font-weight:500}.hw-l.lk{color:var(--faint);filter:blur(3px);user-select:none}
    .hw-desc{margin:10px 0 0 29px;padding:10px 14px;background:rgba(255,255,255,.03);border-left:2px solid rgba(201,122,69,.25);border-radius:0 6px 6px 0;color:var(--text);font-size:14px;line-height:2;white-space:pre-line}
    .hw-desc .step{display:flex;gap:8px;padding:2px 0;align-items:flex-start}.hw-desc .step-dot{color:var(--faint);flex-shrink:0;margin-top:1px}
    .hw-desc .step-arrow{color:var(--accent);flex-shrink:0;font-size:10px;margin-top:2px;opacity:.7}
    .hw-step-cb{width:13px;height:13px;border-radius:3px;border:1.5px solid #333;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:3px}
    .hw-step-cb:hover{border-color:var(--dim)}
    .hw-step-cb.checked{background:var(--accent);border-color:var(--accent);color:#fff}
    .step-done{text-decoration:line-through;opacity:.5}
    .hw-label{padding:8px 0 2px;font-size:11px;font-weight:600;color:var(--accent);font-family:var(--mono);letter-spacing:1px;text-transform:uppercase}
    .hw-desc a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;transition:opacity .2s}.hw-desc a:hover{opacity:.8}
    .hw-desc-edit{margin:0;width:100%;padding:14px 16px;background:rgba(18,16,14,.8);border:1px solid rgba(255,255,255,.08);border-radius:10px;color:var(--bright);font-size:14px;line-height:1.9;font-family:var(--sans);outline:none;resize:none;overflow:hidden;min-height:120px;transition:border-color .2s}
    .hw-desc-edit:focus{border-color:rgba(201,122,69,.25)}
    .hw-edit-wrap{margin:10px 0 0 29px;width:calc(100% - 29px)}
    .hw-st{cursor:text;border-radius:4px;padding:1px 4px;margin:-1px -4px;transition:background .15s}
    .hw-st:hover{background:rgba(255,255,255,.04)}
    .hw-st-inp{background:rgba(201,122,69,.06);border:1px solid rgba(201,122,69,.15);border-radius:6px;padding:4px 8px;outline:none;color:var(--bright);font:inherit;font-size:14px;width:100%;line-height:1.6}
    .hw-ctx{position:fixed;z-index:500;background:var(--surface);border:1px solid var(--border-hi);border-radius:10px;padding:4px;min-width:160px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:fadeUp .12s ease}
    .hw-ctx-item{padding:8px 12px;border-radius:6px;color:var(--text);font-size:12px;font-family:var(--mono);cursor:pointer;transition:all .1s;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
    .hw-ctx-item:hover{background:rgba(255,255,255,.05);color:var(--bright)}
    .hw-ctx-item.danger{color:var(--red)}.hw-ctx-item.danger:hover{background:rgba(217,83,79,.08)}
    .hw-ctx-sep{height:1px;background:var(--border);margin:4px 0}
    .hw-add-step{margin:8px 0 0;padding:6px 12px;background:none;border:none;color:var(--faint);font-size:12px;font-family:var(--mono);cursor:pointer;transition:color .15s;letter-spacing:.3px}

function qtCardDesc(q){
  const lines=['--Steps:'];
  q.steps.forEach(s=>lines.push(s));
  lines.push('--Drill:');
  lines.push('Do 4 fresh '+q.name+' questions — log each one in the worksheet below');
  lines.push('Follow the steps above on every single question. No skipping steps.');
  lines.push('Feeling good? Add a 5th question with + Add Another Question');
  lines.push('--Pace:');
  lines.push('Untimed while you learn the steps — accuracy first');
  lines.push('Once the steps feel automatic, aim for about {per_q_time} per question');
  lines.push('--Resources:');
  if(q.links.flowchart)lines.push('[Flowchart]('+q.links.flowchart+')');
  if(q.links.worksheet)lines.push('[Practice Worksheet]('+q.links.worksheet+')');
  if(q.links.lesson)lines.push('[Cheat Sheet / Lesson]('+q.links.lesson+')');
  return lines.join('\n');
}

function qtFromLabel(label){
  if(!label)return null;
  const l=label.toLowerCase().replace(/^drill:\s*/,'').trim();
  if(l==='assumption recognition practice')return QT_DRILLS['necessary-assumption'];
  for(const k of Object.keys(QT_DRILLS)){if(QT_DRILLS[k].name.toLowerCase()===l)return QT_DRILLS[k];}
  return null;
}

function hwCardByLabel(label){

function applyTiming(desc,tf){
  if(!desc)return desc;
  const t=TIMING[tf]||TIMING['1x'];
  return desc.replace(/\{([^}]+)\}/g,(_,k)=>t[k]||_);
}

function parseClock(s){
  if(s==null)return null;s=String(s).trim();
  if(/^\d+:\d{1,2}$/.test(s)){const p=s.split(':');return parseInt(p[0])*60+parseInt(p[1]);}
  if(/^\d+(\.\d+)?$/.test(s))return Math.round(parseFloat(s)*60);
  return null;
}
function fmtClock(sec){
  if(sec==null||isNaN(sec))return'—';
  const m=Math.floor(sec/60),s=Math.round(sec%60);
  return m+':'+String(s).padStart(2,'0');
}

function linkify(text){
  text=text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  text=text.replace(/(^|[^"'>])(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return text;
}

async function applyTemplate(studentId,tplKey){
  const tpl=TEMPLATES[tplKey];if(!tpl)return;
  await db.from('students').update({package_type:tpl.package_type,sessions_bought:tpl.sessions_bought}).eq('id',studentId);
  for(const s of tpl.sessions){
    const{data:sess}=await db.from('sessions').insert({student_id:studentId,session_number:s.n,title:s.title,subtitle:s.subtitle,description:s.description,status:s.status}).select().single();
    if(!sess)continue;
    for(let gi=0;gi<s.goals.length;gi++){
      await db.from('session_goals').insert({session_id:sess.id,goal_text:s.goals[gi],sort_order:gi});
    }
    for(let hi=0;hi<s.homework.length;hi++){
      await db.from('homework').insert({session_id:sess.id,label:s.homework[hi].label,hw_type:hwTypeCode(s.homework[hi].label),description:s.homework[hi].desc||null,sort_order:hi});
    }
  }
}

async function loadUser(){
  const{data:{user}}=await db.auth.getUser();
  if(!user){S.view='login';R();return;}
  S.user=user;
  const{data:prof}=await db.from('profiles').select('*').eq('id',user.id).single();
  S.profile=prof;S.isTutor=prof&&(prof.role==='owner'||prof.role==='tutor');
  if(S.isTutor){
    const{data:sts}=await db.from('students').select('*, profiles!profile_id(first_name, email)').eq('assigned_tutor_id',user.id).order('created_at',{ascending:false});
    S.students=sts||[];
    const actv=S.students.filter(st=>st.status!=='inactive');
    const curStillValid=S.selId&&S.students.find(st=>st.id===S.selId&&st.status!=='inactive');
    if(curStillValid){await loadStudent(S.selId);}
    else if(actv.length>0){S.selId=actv[0].id;await loadStudent(actv[0].id);}
    else{S.selId=null;S.student=null;S.sessions=[];}
  }else{
    const{data:sts}=await db.from('students').select('*, profiles!profile_id(first_name, email)').eq('profile_id',user.id);
    if(sts&&sts.length>0){S.students=sts;S.selId=sts[0].id;S.student=sts[0];await loadStudent(sts[0].id);}else{S.student=null;S.sessions=[];}
  }
  S.view='dash';S.loginLoad=false;R();
}

async function loadStudent(id){
  const{data:st}=await db.from('students').select('*, profiles!profile_id(first_name, email)').eq('id',id).single();
  S.student=st;
  const{data:sess}=await db.from('sessions').select('*').eq('student_id',id).order('session_number');
  const sessIds=(sess||[]).map(s=>s.id);
  let allGoals=[],allHw=[];
  if(sessIds.length>0){
    const[gRes,hRes]=await Promise.all([
      db.from('session_goals').select('*').in('session_id',sessIds).order('sort_order'),
      db.from('homework').select('*').in('session_id',sessIds).order('sort_order')
    ]);
    allGoals=gRes.data||[];allHw=hRes.data||[];
  }
  const allHwIds=allHw.map(h=>h.id);
  for(let s of(sess||[])){
    s.goals=allGoals.filter(g=>g.session_id===s.id);
    s.homework=allHw.filter(h=>h.session_id===s.id);
  }
  S.sessions=sess||[];
  if(allHwIds.length>0){
    const{data:wse}=await db.from('worksheet_entries').select('*').in('homework_id',allHwIds).order('entry_number');
    S.wsEntries={};
    for(const e of(wse||[])){
      if(!S.wsEntries[e.homework_id])S.wsEntries[e.homework_id]=[];
      S.wsEntries[e.homework_id].push(e);
    }
  }else{S.wsEntries={};}
}

async function addStudent(){
  const email=S.addEmail.trim().toLowerCase();
  if(!email){S.addMsg='Enter an email';S.addMsgType='err';R();return;}
  const{data:profs}=await db.from('profiles').select('*').eq('email',email);
  if(!profs||profs.length===0){S.addMsg='No account found. Create their account in Supabase first.';S.addMsgType='err';R();return;}
  const{data:existing}=await db.from('students').select('id').eq('profile_id',profs[0].id).eq('assigned_tutor_id',S.user.id);
  if(existing&&existing.length>0){S.addMsg='Already added as your student';S.addMsgType='err';R();return;}
  const pkg=S.addTpl&&TEMPLATES[S.addTpl]?TEMPLATES[S.addTpl].package_type:'5-session';
  const bought=S.addTpl&&TEMPLATES[S.addTpl]?TEMPLATES[S.addTpl].sessions_bought:5;
  const{data:newSt,error}=await db.from('students').insert({profile_id:profs[0].id,assigned_tutor_id:S.user.id,package_type:pkg,sessions_bought:bought,status:'active'}).select().single();
  if(error){S.addMsg='Error: '+error.message;S.addMsgType='err';R();return;}
  if(S.addTpl&&TEMPLATES[S.addTpl]&&newSt){
    S.addMsg='Applying template...';S.addMsgType='ok';R();
    await applyTemplate(newSt.id,S.addTpl);
  }
  S.addMsg=(profs[0].first_name||'Student')+' added!';S.addMsgType='ok';S.addEmail='';S.addTpl='';
  await loadUser();
}

function getStepCompletions(h){
  if(!h.step_completions)return{};
  try{
    const p=JSON.parse(h.step_completions);
    if(typeof p==='object'&&!Array.isArray(p))return p;
    if(Array.isArray(p)){const steps=(h.description||'').split('\n').filter(l=>l.trim());const obj={};for(let i=0;i<steps.length;i++){const k=steps[i].trim();if(!k.startsWith('--')&&p[i]===true)obj[k]=true;}return obj;}
    return{};
  }catch(e){return{};}
}

function wsType(label){
  if(!label)return null;
  const l=label.toLowerCase().trim();
  if(l==='blind review')return'blind_review';
  if(l==='confidence log')return'confidence_log';
  if(l==='rc blind review'||l==='rc passage breakdown')return'rc_claim_tracking';
  if(l==='2 hard rc passages (untimed)'||l==='1 rc section (timed)')return'rc_claim_tracking';
  if(l==='lr section reset')return'insight_to_action';
  if(l.indexOf('insight to action')===0||l==='final insight to action review'||l==='final insight to action')return'insight_to_action';
  if(l==='timing log + lr section'||l==='pacing drill: lr sections'||l==='first 10 in 10 drill'||l==='timed lr section')return'timing_log';
  if(l==='1 lr section (timed)'||l==='practice test + blind review'||l==='practice test')return'blind_review';
  if(l==='assumption recognition practice')return'question_type_drill';
  if(l.startsWith('drill:')&&qtFromLabel(label))return'question_type_drill';
  return null;
}

/* Rename-proof worksheet attachment.
   hwTypeCode(label): computed ONCE when a card is inserted — stores the worksheet
   identity in homework.hw_type ('blind_review', 'qt:flaw', 'timing_log', ...) so the
   label becomes purely cosmetic afterward.
   hwWs(h): render-time resolver — reads hw_type first; legacy rows that just say
   'drill' fall back to the old label matching, so existing cards behave
   exactly as before. No data migration needed. */
function hwTypeCode(label){
  const t=wsType(label);
  if(!t)return'drill';
  if(t==='question_type_drill'){
    const q=qtFromLabel(label);
    if(q){for(const k of Object.keys(QT_DRILLS)){if(QT_DRILLS[k]===q)return'qt:'+k;}}
    return'drill';
  }
  return t;
}

function hwWs(h){
  const ht=(h&&h.hw_type)||'';
  if(ht&&ht!=='drill'){
    if(ht.indexOf('qt:')===0)return QT_DRILLS[ht.substring(3)]?'question_type_drill':wsType(h.label);
    if(ht==='blind_review'||ht==='confidence_log'||ht==='rc_claim_tracking'||ht==='insight_to_action'||ht==='timing_log')return ht;
    return wsType(h.label);
  }
  return wsType(h.label);
}

function wsSummaryText(hwId,type){
  const entries=(S.wsEntries[hwId]||[]).filter(e=>e.entry_type===type);
  if(entries.length===0)return'No entries yet';
  if(type==='blind_review'){
    const timing=entries.filter(e=>e.data&&e.data.category==='timing').length;
    const knowledge=entries.filter(e=>e.data&&e.data.category==='knowledge').length;
    const sloppy=entries.filter(e=>e.data&&e.data.category==='sloppy').length;
    return`${entries.length} reviewed · ${timing} timing · ${knowledge} knowledge · ${sloppy} sloppy`;
  }
  if(type==='confidence_log'){
    const changed=entries.filter(e=>e.data&&e.data.changed_answer===true).length;
    const right1st=entries.filter(e=>e.data&&e.data.right_first_time===true).length;
    const bad=entries.filter(e=>e.data&&e.data.flag_correct===false).length;
    return`${entries.length} flagged · ${changed} changed · ${right1st} right 1st · ${bad} bad flags`;
  }
  if(type==='rc_claim_tracking'){
    return`${entries.length} paragraph${entries.length===1?'':'s'} tracked`;
  }
  if(type==='insight_to_action'){
    const main=entries.find(e=>e.data&&e.data.is_main);
    if(!main)return'Not started';
    const d=main.data||{};
    const parts=[];
    if(d.misses)parts.push('misses logged');
    if(d.pattern)parts.push('pattern identified');
    if(d.decision)parts.push(d.decision.toLowerCase());
    return parts.length>0?parts.join(' · '):'In progress';
  }
  if(type==='question_type_drill'){
    const correct=entries.filter(e=>e.data&&e.data.result==='Correct').length;
    const missed=entries.filter(e=>e.data&&e.data.result==='Missed').length;
    return`${entries.length} logged · ${correct} correct · ${missed} missed`;
  }
  if(type==='timing_log'){
    const tf=S.student?S.student.time_factor||'1x':'1x';
    const maxSec=parseClock((TIMING[tf]||TIMING['1x']).max_q_time);
    const valid=entries.filter(e=>e.data&&parseClock(e.data.time)!=null);
    const over=valid.filter(e=>parseClock(e.data.time)>maxSec).length;
    const letgo=entries.filter(e=>e.data&&e.data.let_go===true).length;
    return`${entries.length} logged · ${over} over pace · ${letgo} let go`;
  }
  return'';
}

function hwHTML(h,hi,s,si,unlocked){
  const t=S.isTutor;
  const done=!!h.completed;
  const steps=(h.description||'').split('\n').filter(l=>l.trim());
  const comps=getStepCompletions(h);
  const ws=hwWs(h);
  let stepsHTML='';
  if(steps.length>0&&unlocked){
    stepsHTML=`<div class="hw-desc">${steps.map((line,li)=>{
      const l=line.trim();
      if(l.startsWith('--'))return`<div class="hw-label">${esc(l.replace(/^--/,'').replace(/:$/,''))}</div>`;
      const ck=comps[l]===true;
      return`<div class="step ${ck?'step-done':''}"><span class="hw-step-cb ${ck?'checked':''}" data-stepcb="${h.id}" data-stepline="${esc(l)}">${ck?'✓':''}</span><span style="flex:1">${linkify(esc(l))}</span></div>`;
    }).join('')}</div>`;
  }
  let wsFooter='';
  if(ws&&unlocked){
    wsFooter=`<div class="ws-card-footer">
      <button class="ws-open-btn" data-openws="${h.id}" data-wstype="${ws}" data-wssess="${s.id}">Open Worksheet →</button>
      <span class="ws-summary-line">${wsSummaryText(h.id,ws)}</span>
    </div>`;
  }
  return`<div class="hw ${!unlocked?'lk':''} ${done?'hw-done':''}">
    <div class="hw-top">
      ${unlocked?`<span class="hw-cb ${done?'checked':''}" data-hwcb="${h.id}">${done?'✓':''}</span>`:'<span class="hw-num">·</span>'}
      <span class="hw-l ${!unlocked?'lk':''}">${unlocked?(t?`<span class="hw-st" data-hwlabel="${h.id}">${esc(h.label)}</span>`:esc(h.label)):esc(h.label)}</span>
      ${t?`<div class="hw-reorder">
        <button class="reorder-btn" data-hmv="up" data-hwi="${hi}" data-hsess="${s.id}" ${hi===0?'disabled':''}><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg></button>
        <button class="reorder-btn" data-hmv="down" data-hwi="${hi}" data-hsess="${s.id}" ${hi===(s.homework||[]).length-1?'disabled':''}><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></button>
      </div>
      <button class="rm-btn" data-delhw="${h.id}">×</button>`:''}
    </div>
    ${stepsHTML}
    ${t&&unlocked?(steps.length>0?`<button class="hw-add-step" data-edithw="${h.id}">Edit steps</button>`:`<div class="hw-desc-ph" data-edithw="${h.id}">+ Add step-by-step description</div>`):''}
    ${S.hwEditing===h.id?`<div class="hw-edit-wrap">
      <textarea class="hw-desc-edit" id="hw-edit-ta" data-hwid="${h.id}">${esc(h.description||'')}</textarea>
      <div class="hw-edit-toolbar" style="margin-top:6px">
        <button data-savehwdesc="${h.id}">Save</button>
        <button data-cancelhwdesc="${h.id}">Cancel</button>
      </div>
    </div>`:''}
    ${wsFooter}
  </div>`;
}

function wsQuestionTypeDrillHTML(v,name){
  const sess=S.sessions.find(x=>x.id===v.sessId);
  const hw=sess?(sess.homework||[]).find(h=>h.id===v.hwId):null;
  const ht=(hw&&hw.hw_type)||'';
  let q=null;
  if(ht.indexOf('qt:')===0)q=QT_DRILLS[ht.substring(3)];
  if(!q&&hw)q=qtFromLabel(hw.label);
  if(!q)return'<div class="empty"><h3>Worksheet unavailable</h3></div>';
  const entries=(S.wsEntries[v.hwId]||[]).filter(e=>e.entry_type==='question_type_drill');
  const list=entries.length>0?entries:[];
  const correct=entries.filter(e=>e.data&&e.data.result==='Correct').length;
  const missed=entries.filter(e=>e.data&&e.data.result==='Missed').length;
  return`<div class="ws-wrap">
    <div class="ws-title">${esc(q.name)} — Drill Worksheet</div>
    <div class="ws-subtitle">${esc(name)}</div>
    <div class="ws-key-box">
      <div class="ws-key-title">The Steps</div>
      ${q.steps.map(s=>`<div class="ws-key-row"><span class="ws-key-arrow">→</span><span>${esc(s)}</span></div>`).join('')}
      ${q.links.flowchart?`<div class="ws-key-row"><span class="ws-key-arrow">→</span><a href="${q.links.flowchart}" target="_blank" rel="noopener" style="color:var(--accent)">Flowchart</a></div>`:''}
    </div>
    <div class="ws-stats">
      <div class="ws-stat"><div class="ws-stat-num">${entries.length}</div><div class="ws-stat-lbl">Logged</div></div>
      <div class="ws-stat"><div class="ws-stat-num">${correct}</div><div class="ws-stat-lbl">Correct</div></div>
      <div class="ws-stat"><div class="ws-stat-num">${missed}</div><div class="ws-stat-lbl">Missed</div></div>
      <div class="ws-stat"><div class="ws-stat-num">${entries.length>0?Math.round(correct/entries.length*100)+'%':'—'}</div><div class="ws-stat-lbl">Accuracy</div></div>
    </div>
    ${list.map(e=>{
      const d=wsEntryData(e);
      let formHTML='';
      for(const sec of q.form){
        formHTML+=`<div class="ws-sec-lbl">${esc(sec.sec)}</div>`;
        if(sec.note)formHTML+=`<div class="qt-ac-q">${esc(sec.note)}</div>`;
        for(const f of sec.fields){
          if(f.t==='ta')formHTML+=`<div style="margin-bottom:10px"><div class="qt-ac-q">${esc(f.lbl)}</div><textarea class="ws-field" rows="${f.r||2}" data-wsfield="${e.id}" data-wsf="${f.f}" placeholder="${esc(f.ph||'')}">${esc(d[f.f]||'')}</textarea></div>`;
          else if(f.t==='inp')formHTML+=`<div style="margin-bottom:10px;display:flex;align-items:center;gap:10px"><span class="qt-ac-q" style="margin:0">${esc(f.lbl)}</span>${wsInp(e.id,f.f,d[f.f],'')}</div>`;
          else if(f.t==='tags')formHTML+=`<div style="margin-bottom:10px"><div class="qt-ac-q">${esc(f.lbl)}</div><div class="ws-pass-tags">${f.opts.map(o=>`<button class="ws-tag ${d[f.f]===o?'active':''}" data-wsmeta="${e.id}" data-wsf="${f.f}" data-wsv="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`;
          else if(f.t==='ac'){
            const acData=d.ac||{};
            formHTML+=`<div class="ws-ac-grid">${['A','B','C','D','E'].map(L=>{
              const a=acData[L]||{};
              if(f.mode==='explain'){
                const st=a.state||'';
                return`<div class="qt-ac-block"><div class="qt-ac-hd">
                  <span class="ws-ac-badge ${st==='correct'?'correct':st==='wrong'?'wrong':''}" data-qtac="${e.id}" data-letter="${L}" data-acmode="explain">${L}</span>
                  <span class="qt-ac-state">${st==='correct'?'My answer':st==='wrong'?'Eliminated':'Tap letter to mark'}</span>
                </div>
                <input class="ws-ac-inp" data-qtacinp="${e.id}" data-letter="${L}" data-acf="why" value="${esc(a.why||'')}" placeholder="Why is this right or wrong?"></div>`;
              }else{
                const st=a.state||'';
                const states=f.states==='sep'?['skip','elim','pick']:['keep','elim'];
                const stLbl=st==='keep'?'Keep':st==='elim'?'Eliminate':st==='pick'?'Pick & Go':st==='skip'?'Skip':'Tap letter to cycle';
                return`<div class="qt-ac-block"><div class="qt-ac-hd">
                  <span class="ws-ac-badge ${st}" data-qtac="${e.id}" data-letter="${L}" data-acmode="${f.states}">${L}</span>
                  <span class="qt-ac-state">${stLbl}</span>
                </div>
                <div class="qt-ac-q">${esc(f.q1)}</div>
                <input class="ws-ac-inp" data-qtacinp="${e.id}" data-letter="${L}" data-acf="a1" value="${esc(a.a1||'')}" placeholder="...">
                <div class="qt-ac-q">${esc(f.q2)}</div>
                <input class="ws-ac-inp" data-qtacinp="${e.id}" data-letter="${L}" data-acf="a2" value="${esc(a.a2||'')}" placeholder="..." style="margin-top:4px"></div>`;
              }
            }).join('')}</div>`;
          }
        }
      }
      return`<div class="ws-entry">
        <div class="ws-entry-hd">
          <span class="ws-entry-lbl">Question</span>
          ${wsInp(e.id,'question_num',d.question_num,'#')}
          <span class="ws-entry-lbl" style="margin-left:12px">Result</span>
          ${wsDrop(e.id,'result',d.result,['Correct','Missed'])}
          <button class="rm-btn" data-delentry="${e.id}" style="margin-left:auto">×</button>
        </div>
        ${formHTML}
      </div>`;
    }).join('')}
    <button class="ws-add-btn" data-wsadd="${v.hwId}" data-wsaddtype="question_type_drill">+ Add Another Question</button>
  </div>`;
}

async function saveQtAc(entryId,letter,patch){
  const all=Object.values(S.wsEntries).flat();
  const e=all.find(x=>x.id===entryId);
  if(!e)return;
  const d=e.data||{};
  const ac=d.ac||{};
  ac[letter]={...(ac[letter]||{}),...patch};
  d.ac=ac;e.data=d;
  const{error}=await db.from('worksheet_entries').update({data:d}).eq('id',entryId);
  showSaved(!error);
}

function wsTimingLogHTML(v,name){
  const tf=S.student?(S.student.time_factor||'1x'):'1x';
  const T=TIMING[tf]||TIMING['1x'];
  const maxSec=parseClock(T.max_q_time);
  const entries=(S.wsEntries[v.hwId]||[]).filter(e=>e.entry_type==='timing_log');
  const valid=entries.filter(e=>e.data&&parseClock(e.data.time)!=null);
  const over=valid.filter(e=>parseClock(e.data.time)>maxSec).length;
  const letgo=entries.filter(e=>e.data&&e.data.let_go===true).length;
  let f10=0,f10n=0;
  for(const e of valid){
    const qn=parseInt((e.data.question_num||'').toString().replace(/\D/g,''));
    if(qn>=1&&qn<=10){f10+=parseClock(e.data.time);f10n++;}
  }
  return`<div class="ws-wrap">
    <div class="ws-title">Timing Log</div>
    <div class="ws-subtitle">${esc(name)} · your pace: max ${esc(T.max_q_time)} per question, first 10 in ${esc(T.first10_time)}</div>
    <div class="ws-desc">One row per question. Enter time as m:ss (like 1:25). Anything over ${esc(T.max_q_time)} gets flagged automatically. Mark "let go" on questions you skipped on first pass and came back to — that's the discipline we're building.</div>
    <div class="ws-stats">
      <div class="ws-stat"><div class="ws-stat-num">${entries.length}</div><div class="ws-stat-lbl">Logged</div></div>
      <div class="ws-stat"><div class="ws-stat-num">${over}</div><div class="ws-stat-lbl">Over ${esc(T.max_q_time)}</div></div>
      <div class="ws-stat"><div class="ws-stat-num">${f10n>0?fmtClock(f10):'—'}</div><div class="ws-stat-lbl">First 10 Total</div></div>

/* ===================== PICKERS ===================== */
function openPicker(sessId){
  if(document.getElementById('hw-picker-overlay'))return;
  const selected=new Set();
  let curTab='all';
  function cardMatches(card,tab){
    if(tab==='all')return true;
    if(!card.tiers)return true;
    return card.tiers.indexOf(tab)>=0;
  }
  function buildHTML(){
    const tabsHTML=`<div class="picker-tabs">${Object.entries(HW_TABS).map(([k,n])=>`<button class="picker-tab ${curTab===k?'active':''}" data-hwtab="${k}">${n}</button>`).join('')}</div>`;
    const groupsHTML=Object.entries(HW_CARDS).map(([gkey,g])=>{
      const cardsHTML=g.cards.map((card,ci)=>{
        if(!cardMatches(card,curTab))return'';
        const key=gkey+'-'+ci;
        const sel=selected.has(key);
        return`<div class="picker-card ${sel?'selected':''}" data-pkey="${key}">
          <span class="picker-check">${sel?'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>':''}</span>
          <div class="picker-card-info">
            <div class="picker-card-name">${esc(card.label)}</div>
            ${card.desc?`<div class="picker-card-desc">${esc(card.desc.split('\n').slice(0,2).join('\n'))}${card.desc.split('\n').length>2?'…':''}</div>`:''}
          </div>
        </div>`;
      }).join('');
      if(!cardsHTML.trim())return'';
      return`<div class="picker-group"><div class="picker-group-label">${esc(g.group)}</div><div class="picker-grid">${cardsHTML}</div></div>`;
    }).join('');
    return`<div class="picker-panel">
      <div class="picker-title">Add Homework</div>
      <div class="picker-sub">Pick one or more cards — everything is editable after adding</div>
      ${tabsHTML}
      <div id="hw-picker-groups">${groupsHTML}</div>
      <div class="picker-footer">
        <div class="picker-count"><span>${selected.size}</span> selected</div>
        <div class="picker-actions">
          <button class="picker-cancel" id="hw-picker-cancel">Cancel</button>
          <button class="picker-add" id="hw-picker-add" ${selected.size===0?'disabled':''}>Add Selected</button>
        </div>
      </div>
    </div>`;
  }
  const overlay=document.createElement('div');
  overlay.className='picker-overlay';overlay.id='hw-picker-overlay';
  overlay.innerHTML=buildHTML();
  document.body.appendChild(overlay);
  function rebuild(){
    const sc=overlay.querySelector('.picker-panel')?overlay.scrollTop:0;
    overlay.innerHTML=buildHTML();
    overlay.scrollTop=sc;
    wire();
  }
  function wire(){
    overlay.querySelectorAll('[data-hwtab]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();curTab=b.dataset.hwtab;rebuild();}));
    overlay.querySelectorAll('[data-pkey]').forEach(c=>c.addEventListener('click',e=>{
      e.stopPropagation();
      const k=c.dataset.pkey;
      if(selected.has(k))selected.delete(k);else selected.add(k);
      rebuild();
    }));
    const cancel=overlay.querySelector('#hw-picker-cancel');
    if(cancel)cancel.addEventListener('click',()=>overlay.remove());
    const add=overlay.querySelector('#hw-picker-add');
    if(add)add.addEventListener('click',async()=>{
      add.disabled=true;add.textContent='Adding...';
      const sess=S.sessions.find(x=>x.id===sessId);
      const hws=(sess&&sess.homework)||[];
      let sortBase=hws.length>0?Math.max(...hws.map(h=>h.sort_order||0))+1:0;
      const tf=S.student?(S.student.time_factor||'1x'):'1x';
      let err=null;
      for(const k of selected){
        const dash=k.lastIndexOf('-');
        const gkey=k.substring(0,dash),ci=parseInt(k.substring(dash+1));
        const card=HW_CARDS[gkey]&&HW_CARDS[gkey].cards[ci];
        if(!card)continue;
        const{error}=await db.from('homework').insert({session_id:sessId,label:card.label,hw_type:hwTypeCode(card.label),description:card.desc?applyTiming(card.desc,tf):null,sort_order:sortBase++});
        if(error)err=error;
      }
      overlay.remove();
      await loadStudent(S.selId);R();showSaved(!err);
    });
    overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  }
  wire();
}

async function syncPackage(){
  if(!S.student)return;
  const n=S.sessions.filter(s=>s.session_number>0).length;
  if(S.student.sessions_bought!==n&&n>0){
    await db.from('students').update({sessions_bought:n}).eq('id',S.student.id);
  }
}

function openSessPicker(){
  if(document.getElementById('sess-picker-overlay'))return;
  const selected=[];
  let curTab='f';
  function checkSVG(){return'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';}
  function buildHTML(){
    const tabsHTML=`<div class="picker-tabs">${Object.entries(SESS_TABS).map(([k,t])=>`<button class="picker-tab ${curTab===k?'active':''}" data-stab="${k}">${t.name}</button>`).join('')}</div>`;
    const groups=SESS_TABS[curTab].groups.concat(['blanksess']);
    const groupsHTML=groups.map(gkey=>{
      const g=SESSION_CARDS[gkey];
      if(!g)return'';
      return`<div class="picker-group"><div class="picker-group-label">${esc(g.group)}</div><div class="picker-grid">
        ${g.cards.map((card,ci)=>{
          const key=gkey+'-'+ci;
          const pos=selected.indexOf(key);
          const sel=pos>=0;
          return`<div class="picker-card ${sel?'selected':''}" data-skey="${key}">
            <span class="picker-check" ${sel?'style="background:var(--accent);border-color:var(--accent);color:#fff;font-family:var(--mono);font-size:10px;font-weight:700"':''}>${sel?(pos+1):''}</span>
            <div class="picker-card-info">
              <div class="picker-card-name">${esc(card.title)}${card.subtitle?` <span style="color:var(--dim);font-weight:400;font-size:12px">· ${esc(card.subtitle)}</span>`:''}</div>
              ${card.description?`<div class="picker-card-desc">${esc(card.description)}</div>`:''}
            </div>
          </div>`;
        }).join('')}
      </div></div>`;
    }).join('');
    return`<div class="picker-panel">
      <div class="picker-title">Add Sessions</div>
      <div class="picker-sub">Selection order sets session order — numbered chips show the sequence</div>
      ${tabsHTML}
      <div id="sess-picker-groups">${groupsHTML}</div>
      <div class="picker-footer">
        <div class="picker-count"><span>${selected.length}</span> selected</div>
        <div class="picker-actions">
          <button class="picker-cancel" id="sess-picker-cancel">Cancel</button>
          <button class="picker-add" id="sess-picker-add" ${selected.length===0?'disabled':''}>Add Selected</button>
        </div>
      </div>
    </div>`;
  }
  const overlay=document.createElement('div');
  overlay.className='picker-overlay';overlay.id='sess-picker-overlay';
  overlay.innerHTML=buildHTML();
  document.body.appendChild(overlay);
  function rebuild(){
    const sc=overlay.scrollTop;
    overlay.innerHTML=buildHTML();
    overlay.scrollTop=sc;
    wire();
  }
  function wire(){
    overlay.querySelectorAll('[data-stab]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();curTab=b.dataset.stab;rebuild();}));
    overlay.querySelectorAll('[data-skey]').forEach(c=>c.addEventListener('click',e=>{
      e.stopPropagation();
      const k=c.dataset.skey;
      const pos=selected.indexOf(k);
      if(pos>=0)selected.splice(pos,1);else selected.push(k);
      rebuild();
    }));
    const cancel=overlay.querySelector('#sess-picker-cancel');
    if(cancel)cancel.addEventListener('click',()=>overlay.remove());
    const add=overlay.querySelector('#sess-picker-add');
    if(add)add.addEventListener('click',async()=>{
      add.disabled=true;add.textContent='Adding...';
      const tf=S.student?(S.student.time_factor||'1x'):'1x';
      let nextNum=S.sessions.length>0?Math.max(...S.sessions.map(x=>x.session_number))+1:1;
      let zeroUsed=S.sessions.some(x=>x.session_number===0);
      const firstEver=S.sessions.length===0;
      let err=null;
      for(let si=0;si<selected.length;si++){
        const k=selected[si];
        const dash=k.lastIndexOf('-');
        const gkey=k.substring(0,dash),ci=parseInt(k.substring(dash+1));
        const card=SESSION_CARDS[gkey]&&SESSION_CARDS[gkey].cards[ci];
        if(!card)continue;
        let num;
        if(card.n0&&!zeroUsed){num=0;zeroUsed=true;}else{num=nextNum++;}
        const status=(firstEver&&si===0)?'upcoming':'locked';
        const{data:sess,error}=await db.from('sessions').insert({student_id:S.selId,session_number:num,title:card.title||'New Session',subtitle:card.subtitle||null,description:card.description||null,status:status}).select().single();
        if(error){err=error;continue;}
        if(!sess)continue;
        for(let gi=0;gi<(card.goals||[]).length;gi++){
          const r=await db.from('session_goals').insert({session_id:sess.id,goal_text:card.goals[gi],sort_order:gi});
          if(r.error)err=r.error;
        }
        for(let hi=0;hi<(card.hw||[]).length;hi++){
          const hc=hwCardByLabel(card.hw[hi]);
          if(!hc)continue;
          const r=await db.from('homework').insert({session_id:sess.id,label:hc.label,hw_type:hwTypeCode(hc.label),description:hc.desc?applyTiming(hc.desc,tf):null,sort_order:hi});
          if(r.error)err=r.error;
        }
      }
      await syncPackage();
      overlay.remove();
      await loadStudent(S.selId);R();showSaved(!err);
    });
    overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  }
  wire();
}

    S.loginErr='Password reset link sent. Check your inbox.';R();

    await loadUser();
  }));
  const ae=document.getElementById('add-email');
  if(ae)ae.addEventListener('input',()=>{S.addEmail=ae.value;});
  const atl=document.getElementById('add-tpl');
  if(atl)atl.addEventListener('change',()=>{S.addTpl=atl.value;});
  const ab=document.getElementById('add-btn');
  if(ab)ab.addEventListener('click',addStudent);
  const tfs=document.getElementById('tf-sel');
  if(tfs)tfs.addEventListener('change',async()=>{
    const{error}=await db.from('students').update({time_factor:tfs.value}).eq('id',S.student.id);
    S.student.time_factor=tfs.value;showSaved(!error);
  });

  /* expand/collapse sessions — ignore clicks on interactive elements */
  document.querySelectorAll('[data-tog]').forEach(el=>el.addEventListener('click',e=>{
    if(e.target.closest('.ed,.ed-inp,.ed-ta,.reorder-btn,.hw-reorder,.tc-btn,.rm-btn,input,select,textarea,a,button'))return;
    const i=parseInt(el.dataset.tog);
    S.exSess=S.exSess===i?-1:i;R();
  }));

  /* session reorder arrows (tutor) */
  document.querySelectorAll('[data-smv]').forEach(b=>b.addEventListener('click',async e=>{
    e.stopPropagation();
    if(b.disabled)return;
    const i=parseInt(b.dataset.ssi);
    const j=b.dataset.smv==='up'?i-1:i+1;
    if(j<0||j>=S.sessions.length)return;
    const ordered=[...S.sessions];
    const tmp=ordered[i];ordered[i]=ordered[j];ordered[j]=tmp;
    const base=ordered.length>0?Math.min(...ordered.map(s=>s.session_number)):1;
    let err=null;
    for(let k=0;k<ordered.length;k++){
      const r=await db.from('sessions').update({session_number:base+k}).eq('id',ordered[k].id);
      if(r.error)err=r.error;
    }
    if(S.exSess===i)S.exSess=j;else if(S.exSess===j)S.exSess=i;
    await loadStudent(S.selId);R();showSaved(!err);
  }));

  /* session drag & drop (desktop bonus) */
  if(S.isTutor){
    let dragIdx=null;
    document.querySelectorAll('.sess[draggable="true"]').forEach(el=>{
      el.addEventListener('dragstart',()=>{dragIdx=parseInt(el.dataset.si);el.classList.add('dragging');});
      el.addEventListener('dragend',()=>{el.classList.remove('dragging');document.querySelectorAll('.sess').forEach(x=>x.classList.remove('drag-over-above','drag-over-below'));});
      el.addEventListener('dragover',e=>{
        e.preventDefault();
        const ti=parseInt(el.dataset.si);
        if(ti===dragIdx)return;
        el.classList.toggle('drag-over-above',ti<dragIdx);
        el.classList.toggle('drag-over-below',ti>dragIdx);
      });
      el.addEventListener('dragleave',()=>el.classList.remove('drag-over-above','drag-over-below'));
      el.addEventListener('drop',async e=>{
        e.preventDefault();
        const ti=parseInt(el.dataset.si);
        if(dragIdx===null||ti===dragIdx)return;
        const ordered=[...S.sessions];
        const[m]=ordered.splice(dragIdx,1);
        ordered.splice(ti,0,m);
        const base=ordered.length>0?Math.min(...ordered.map(s=>s.session_number)):1;
        let err=null;
        for(let k=0;k<ordered.length;k++){
          const r=await db.from('sessions').update({session_number:base+k}).eq('id',ordered[k].id);
          if(r.error)err=r.error;
        }
        dragIdx=null;
        await loadStudent(S.selId);R();showSaved(!err);
      });
    });
  }

  /* tutor controls */
  document.querySelectorAll('[data-cyc]').forEach(b=>b.addEventListener('click',async e=>{
    e.stopPropagation();
    const s=S.sessions[parseInt(b.dataset.cyc)];
    const next=s.status==='upcoming'?'completed':s.status==='completed'?'locked':'upcoming';
    const{error}=await db.from('sessions').update({status:next}).eq('id',s.id);
    await loadStudent(S.selId);R();showSaved(!error);
  }));
  document.querySelectorAll('[data-delsess]').forEach(b=>b.addEventListener('click',async e=>{
    e.stopPropagation();
    if(!confirm('Delete this session and all its goals/homework?'))return;
    const s=S.sessions[parseInt(b.dataset.delsess)];
    await db.from('session_goals').delete().eq('session_id',s.id);
    await db.from('homework').delete().eq('session_id',s.id);
    const{error}=await db.from('sessions').delete().eq('id',s.id);
    S.exSess=-1;
    await syncPackage();
    await loadStudent(S.selId);R();showSaved(!error);
  }));
  document.querySelectorAll('[data-copyhw]').forEach(b=>b.addEventListener('click',async e=>{
    e.stopPropagation();
    const i=parseInt(b.dataset.copyhw);
    const s=S.sessions[i],prev=S.sessions[i-1];
    if(!prev)return;
    const hws=(prev.homework||[]);
    if(hws.length===0){S.hwCopyMsg='Previous session has no homework';S.hwCopyMsgSess=i;R();return;}
    const cur=(s.homework||[]);
    let sortBase=cur.length>0?Math.max(...cur.map(h=>h.sort_order||0))+1:0;
    let err=null;
    for(const h of hws){
      const r=await db.from('homework').insert({session_id:s.id,label:h.label,hw_type:h.hw_type||'drill',description:h.description||null,sort_order:sortBase++});
      if(r.error)err=r.error;
    }
    S.hwCopyMsg='';S.hwCopyMsgSess=null;
    await loadStudent(S.selId);R();showSaved(!err);
  }));

  /* goals */
  document.querySelectorAll('[data-addgoal]').forEach(b=>b.addEventListener('click',async e=>{
    e.stopPropagation();
    const sid=b.dataset.addgoal;
    const sess=S.sessions.find(x=>x.id===sid);
    const so2=(sess&&sess.goals&&sess.goals.length>0)?Math.max(...sess.goals.map(g=>g.sort_order||0))+1:0;
    const{error}=await db.from('session_goals').insert({session_id:sid,goal_text:'New goal — click to edit',sort_order:so2});
    await loadStudent(S.selId);R();showSaved(!error);
  }));
  document.querySelectorAll('[data-delgoal]').forEach(b=>b.addEventListener('click',async e=>{
    e.stopPropagation();
    const{error}=await db.from('session_goals').delete().eq('id',b.dataset.delgoal);
    await loadStudent(S.selId);R();showSaved(!error);
  }));

  /* homework */
  document.querySelectorAll('[data-addhw]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();openPicker(b.dataset.addhw);
  }));
  const addSess=document.getElementById('add-sess');
  if(addSess)addSess.addEventListener('click',openSessPicker);
  document.querySelectorAll('[data-delhw]').forEach(b=>b.addEventListener('click',async e=>{
    e.stopPropagation();
    if(!confirm('Delete this homework item?'))return;
    const{error}=await db.from('homework').delete().eq('id',b.dataset.delhw);
    await loadStudent(S.selId);R();showSaved(!error);
  }));
  document.querySelectorAll('[data-hwcb]').forEach(cb=>cb.addEventListener('click',async e=>{
    e.stopPropagation();
    const id=cb.dataset.hwcb;
    let hw=null;for(const s of S.sessions){const f=(s.homework||[]).find(h=>h.id===id);if(f){hw=f;break;}}
    if(!hw)return;
    const{error}=await db.from('homework').update({completed:!hw.completed}).eq('id',id);
    hw.completed=!hw.completed;R();showSaved(!error);
  }));
  document.querySelectorAll('[data-stepcb]').forEach(cb=>cb.addEventListener('click',async e=>{
    e.stopPropagation();
    const id=cb.dataset.stepcb,line=cb.dataset.stepline;
    let hw=null;for(const s of S.sessions){const f=(s.homework||[]).find(h=>h.id===id);if(f){hw=f;break;}}
    if(!hw)return;
    const comps=getStepCompletions(hw);
    comps[line]=!comps[line];
    hw.step_completions=JSON.stringify(comps);
    const{error}=await db.from('homework').update({step_completions:hw.step_completions}).eq('id',id);
    R();showSaved(!error);
  }));
  document.querySelectorAll('[data-hmv]').forEach(b=>b.addEventListener('click',async e=>{
    e.stopPropagation();
    if(b.disabled)return;
    const sess=S.sessions.find(x=>x.id===b.dataset.hsess);
    if(!sess)return;
    const hws=[...(sess.homework||[])];
    const i=parseInt(b.dataset.hwi);
    const j=b.dataset.hmv==='up'?i-1:i+1;
    if(j<0||j>=hws.length)return;
    const tmp=hws[i];hws[i]=hws[j];hws[j]=tmp;
    let err=null;
    for(let k=0;k<hws.length;k++){
      const r=await db.from('homework').update({sort_order:k}).eq('id',hws[k].id);
      if(r.error)err=r.error;
    }
    await loadStudent(S.selId);R();showSaved(!err);
  }));

  /* homework label + steps editing (tutor) */
  document.querySelectorAll('[data-hwlabel]').forEach(el=>el.addEventListener('click',e=>{
    e.stopPropagation();
    if(el.querySelector('input'))return;
    const id=el.dataset.hwlabel;
    let hw=null;for(const s of S.sessions){const f=(s.homework||[]).find(h=>h.id===id);if(f){hw=f;break;}}
    if(!hw)return;
    const cur=hw.label;
    el.innerHTML=`<input class="hw-st-inp" value="${esc(cur)}">`;
    const inp=el.querySelector('input');inp.focus();inp.select();
    const save=async()=>{
      const nv=inp.value.trim()||cur;
      const{error}=await db.from('homework').update({label:nv}).eq('id',id);
      hw.label=nv;R();showSaved(!error);
    };
    inp.addEventListener('blur',save);
    inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')inp.blur();if(ev.key==='Escape'){inp.value=cur;inp.blur();}});
  }));
  document.querySelectorAll('[data-edithw]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();S.hwEditing=b.dataset.edithw;R();
    const ta=document.getElementById('hw-edit-ta');
    if(ta){ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';ta.focus();}
  }));
  document.querySelectorAll('[data-savehwdesc]').forEach(b=>b.addEventListener('click',async e=>{
    e.stopPropagation();
    const ta=document.getElementById('hw-edit-ta');
    if(!ta)return;
    const{error}=await db.from('homework').update({description:ta.value}).eq('id',b.dataset.savehwdesc);
    S.hwEditing=null;
    await loadStudent(S.selId);R();showSaved(!error);
  }));
  document.querySelectorAll('[data-cancelhwdesc]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();S.hwEditing=null;R();
  }));

  /* inline editable fields */
  document.querySelectorAll('.ed').forEach(el=>el.addEventListener('click',e=>{
    e.stopPropagation();startEd(el);
  }));

  /* worksheet open + entries */
  document.querySelectorAll('[data-openws]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    S.wsView={hwId:b.dataset.openws,type:b.dataset.wstype,sessId:b.dataset.wssess};
    R();window.scrollTo(0,0);
  }));
  document.querySelectorAll('[data-wsadd]').forEach(b=>b.addEventListener('click',()=>addWsEntry(b.dataset.wsadd,b.dataset.wsaddtype)));
  document.querySelectorAll('[data-delentry]').forEach(b=>b.addEventListener('click',async()=>{
    const{error}=await db.from('worksheet_entries').delete().eq('id',b.dataset.delentry);
    await reloadWsEntries();R();showSaved(!error);
  }));
  document.querySelectorAll('[data-wsfield]').forEach(ta=>ta.addEventListener('blur',()=>saveWsField(ta.dataset.wsfield,ta.dataset.wsf,ta.value)));
  document.querySelectorAll('[data-wsinp]').forEach(inp=>inp.addEventListener('blur',async()=>{
    await saveWsField(inp.dataset.wsinp,inp.dataset.wsf,inp.value);
    if(S.wsView&&(inp.dataset.wsf==='time'||inp.dataset.wsf==='question_num')){R();}
  }));
  document.querySelectorAll('[data-wsdrop]').forEach(sel=>sel.addEventListener('change',async()=>{
    await saveWsField(sel.dataset.wsdrop,sel.dataset.wsf,sel.value);R();
  }));
  document.querySelectorAll('[data-wstog]').forEach(b=>b.addEventListener('click',()=>saveWsToggle(b.dataset.wstog,b.dataset.wsf,b.dataset.wsv==='true')));
  document.querySelectorAll('[data-wsmeta]').forEach(b=>b.addEventListener('click',()=>saveMetaTag(b.dataset.wsmeta,b.dataset.wsf,b.dataset.wsv)));
  document.querySelectorAll('[data-qtac]').forEach(b=>b.addEventListener('click',async()=>{
    const mode=b.dataset.acmode;
    const all=Object.values(S.wsEntries).flat();
    const e=all.find(x=>x.id===b.dataset.qtac);
    const cur=e&&e.data&&e.data.ac&&e.data.ac[b.dataset.letter]?e.data.ac[b.dataset.letter].state:'';
    let next;
    if(mode==='explain')next=cur===''?'correct':cur==='correct'?'wrong':'';
    else if(mode==='sep')next=cur===''?'skip':cur==='skip'?'elim':cur==='elim'?'pick':'';
    else next=cur===''?'keep':cur==='keep'?'elim':'';
    await saveQtAc(b.dataset.qtac,b.dataset.letter,{state:next});R();
  }));
  document.querySelectorAll('[data-qtacinp]').forEach(inp=>inp.addEventListener('blur',()=>{
    const patch={};patch[inp.dataset.acf]=inp.value;
    saveQtAc(inp.dataset.qtacinp,inp.dataset.letter,patch);
  }));
  document.querySelectorAll('[data-claiminp]').forEach(inp=>inp.addEventListener('blur',()=>saveClaimField(inp.dataset.claiminp,parseInt(inp.dataset.ci),inp.value)));
  document.querySelectorAll('[data-addclaim]').forEach(b=>b.addEventListener('click',()=>addClaimToEntry(b.dataset.addclaim)));
  document.querySelectorAll('[data-itafield]').forEach(el=>el.addEventListener('blur',()=>saveItaField(el.dataset.itafield,el.dataset.wsf,el.value)));
  document.querySelectorAll('[data-itacb]').forEach(b=>b.addEventListener('click',async()=>{
    const id=b.dataset.itacb;
    const all=Object.values(S.wsEntries).flat();
    const e=all.find(x=>x.id===id);
    const cur=e&&e.data?e.data[b.dataset.wsf]===true:false;
    await saveItaField(id,b.dataset.wsf,!cur);R();
  }));
  document.querySelectorAll('[data-itadec]').forEach(b=>b.addEventListener('click',async()=>{
    await saveItaField(b.dataset.itadec,'decision',b.dataset.wsv);R();
  }));
}

/* ===================== INLINE EDITING ===================== */
function startEd(el){
  if(el.querySelector('.ed-inp,.ed-ta'))return;
  const eid=el.dataset.eid;
  const ml=el.dataset.ml==='true';
  const isDate=eid.endsWith(':session_date');
  const raw=el.dataset.raw;
  const ph=el.querySelector('.ph');
  const cur=ph?'':(raw!==undefined?raw:el.textContent);
  let inp;
  if(ml){inp=document.createElement('textarea');inp.className='ed-ta';inp.value=cur;}
  else{inp=document.createElement('input');inp.className='ed-inp';if(isDate)inp.type='date';inp.value=cur;}
  el.innerHTML='';el.appendChild(inp);inp.focus();
  if(inp.select&&!isDate)inp.select();
  if(ml){inp.style.height='auto';inp.style.height=Math.max(60,inp.scrollHeight)+'px';}
  let saved=false;
  const save=()=>{if(saved)return;saved=true;saveEd(eid,inp.value.trim());};
  inp.addEventListener('blur',save);
  inp.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'&&!ml){ev.preventDefault();inp.blur();}
    if(ev.key==='Escape'){saved=true;R();}
  });
}

async function saveEd(eid,val){
  const parts=eid.split(':');
  let error=null;
  if(parts[0]==='st'){
    const field=parts[1];
    const upd={};upd[field]=field==='sessions_bought'?(parseInt(val)||0):(val||null);
    ({error}=await db.from('students').update(upd).eq('id',S.student.id));
    S.student[field]=upd[field];
  }else if(parts[0]==='sess'){
    const id=parts[1],field=parts[2];
    const upd={};upd[field]=val||null;
    ({error}=await db.from('sessions').update(upd).eq('id',id));
    const s=S.sessions.find(x=>x.id===id);if(s)s[field]=val||null;
  }else if(parts[0]==='goal'){
    const id=parts[1];
    ({error}=await db.from('session_goals').update({goal_text:val}).eq('id',id));
    for(const s of S.sessions){const g=(s.goals||[]).find(x=>x.id===id);if(g)g.goal_text=val;}
  }
  R();showSaved(!error);
}

/* ===================== WORKSHEET DATA ===================== */
async function saveWsField(entryId,field,val){
  const all=Object.values(S.wsEntries).flat();
  const e=all.find(x=>x.id===entryId);
  if(!e)return;
  const d=e.data||{};d[field]=val;e.data=d;
  const{error}=await db.from('worksheet_entries').update({data:d}).eq('id',entryId);
  showSaved(!error);
}

async function saveWsToggle(entryId,field,val){
  const all=Object.values(S.wsEntries).flat();
  const e=all.find(x=>x.id===entryId);
  if(!e)return;
  const d=e.data||{};
  d[field]=d[field]===val?null:val;
  e.data=d;
  const{error}=await db.from('worksheet_entries').update({data:d}).eq('id',entryId);
  R();showSaved(!error);
}

async function saveMetaTag(entryId,field,val){
  const all=Object.values(S.wsEntries).flat();
  const e=all.find(x=>x.id===entryId);
  if(!e)return;
  const d=e.data||{};
  d[field]=d[field]===val?null:val;
  e.data=d;
  const{error}=await db.from('worksheet_entries').update({data:d}).eq('id',entryId);
  R();showSaved(!error);
}

async function saveClaimField(entryId,ci,val){
  const all=Object.values(S.wsEntries).flat();
  const e=all.find(x=>x.id===entryId);
  if(!e)return;
  const d=e.data||{};
  const claims=Array.isArray(d.claims)?d.claims:[''];
  claims[ci]=val;d.claims=claims;e.data=d;
  const{error}=await db.from('worksheet_entries').update({data:d}).eq('id',entryId);
  showSaved(!error);
}

async function addClaimToEntry(entryId){
  const all=Object.values(S.wsEntries).flat();
  const e=all.find(x=>x.id===entryId);
  if(!e)return;
  const d=e.data||{};
  const claims=Array.isArray(d.claims)?d.claims:[''];
  claims.push('');d.claims=claims;e.data=d;
  const{error}=await db.from('worksheet_entries').update({data:d}).eq('id',entryId);
  R();showSaved(!error);
}

async function reloadWsEntries(){
  if(!S.wsView)return;
  const{data:wse}=await db.from('worksheet_entries').select('*').eq('homework_id',S.wsView.hwId).order('entry_number');
  S.wsEntries[S.wsView.hwId]=wse||[];
}

async function addWsEntry(hwId,type){
  const cur=(S.wsEntries[hwId]||[]).filter(e=>e.entry_type===type);
  const n=cur.length>0?Math.max(...cur.map(e=>e.entry_number||0))+1:1;
  const data=type==='rc_claim_tracking'?{claims:['']}:{};
  const{error}=await db.from('worksheet_entries').insert({homework_id:hwId,entry_type:type,entry_number:n,data:data});
  await reloadWsEntries();R();showSaved(!error);
}

async function saveItaField(entryId,field,val){
  if(String(entryId).indexOf('new:')===0){
    const hwId=String(entryId).substring(4);
    const data={is_main:true};data[field]=val;
    const{error}=await db.from('worksheet_entries').insert({homework_id:hwId,entry_type:'insight_to_action',entry_number:1,data:data});
    if(S.wsView)await reloadWsEntries();
    showSaved(!error);
    return;
  }
  const all=Object.values(S.wsEntries).flat();
  const e=all.find(x=>x.id===entryId);
  if(!e)return;
  const d=e.data||{};d[field]=val;d.is_main=true;e.data=d;
  const{error}=await db.from('worksheet_entries').update({data:d}).eq('id',entryId);
  showSaved(!error);
}

/* ===================== INIT ===================== */
async function init(){
  R();
  const{data:{session}}=await db.auth.getSession();
  if(session){await loadUser();}
  else{S.view='login';R();}
}
init();
</script>
