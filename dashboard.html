<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEDARION — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#080808;--surface:#0c0c0c;--border:#151515;--border-hi:#252525;
      --input:#0a0a0a;--text:#d4d4d4;--bright:#eaeaea;--dim:#777;--muted:#555;
      --faint:#333;--deep:#1a1a1a;--accent:#c97a45;--green:#5cb85c;
      --green-bg:rgba(92,184,92,.08);--red:#d9534f;
      --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;
      --serif:'Libre Baskerville',Georgia,serif;
    }
    body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#1a1a1a;border-radius:2px}
    select option{background:#111;color:#bbb}

    .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:radial-gradient(ellipse at 50% 30%,rgba(201,122,69,.03) 0%,transparent 60%)}
    .login-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:48px 40px;width:100%;max-width:380px;animation:fadeUp .5s ease;box-shadow:0 32px 64px rgba(0,0,0,.4)}
    .logo{font-family:var(--mono);font-weight:700;letter-spacing:4px}.logo .v{color:var(--accent)}.logo .rest{color:var(--bright)}
    .login-box .logo{font-size:20px;text-align:center;margin-bottom:40px}
    .lbl{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:block}
    .inp{width:100%;padding:14px 16px;background:var(--input);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--sans);font-size:14px;outline:none;margin-bottom:20px;transition:border-color .2s}
    .inp:focus{border-color:#2a2a2a}.inp::placeholder{color:var(--faint)}
    .btn-primary{width:100%;padding:14px;background:var(--deep);border:1px solid #222;border-radius:10px;color:var(--bright);font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.5px;cursor:pointer;transition:all .2s}
    .btn-primary:hover{background:#222;border-color:#333}.btn-primary:disabled{opacity:.4;cursor:not-allowed}
    .login-err{color:var(--red);font-size:12px;text-align:center;margin-top:14px}
    .forgot{text-align:center;margin-top:16px}.forgot a{color:var(--faint);font-size:11px;font-family:var(--mono);text-decoration:none;transition:color .2s}.forgot a:hover{color:var(--muted)}

    .nav{padding:16px 32px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(8,8,8,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:100}
    .nav-left{display:flex;align-items:center;gap:12px}.nav .logo{font-size:14px}
    .nav-sep{color:#1a1a1a;font-size:14px}.nav-role{color:var(--muted);font-size:11px;font-family:var(--mono);letter-spacing:.5px}
    .nav-links{display:flex;align-items:center;gap:2px}
    .nav-link{padding:6px 14px;color:var(--faint);font-family:var(--mono);font-size:10px;text-decoration:none;border-radius:6px;transition:all .2s;letter-spacing:.5px}
    .nav-link:hover{color:var(--muted);background:rgba(255,255,255,.02)}
    .nav-right{display:flex;align-items:center;gap:14px}
    .nav-user{color:var(--faint);font-size:11px;font-family:var(--mono)}
    .sign-out{padding:6px 14px;background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--faint);font-family:var(--mono);font-size:10px;cursor:pointer;transition:all .2s;letter-spacing:.3px}
    .sign-out:hover{border-color:var(--faint);color:var(--muted)}

    .edit-banner{padding:8px 32px;background:rgba(201,122,69,.03);border-bottom:1px solid rgba(201,122,69,.06);display:flex;align-items:center;gap:8px}
    .edit-banner svg{opacity:.4}.edit-banner span{font-size:10px;color:var(--faint);font-family:var(--mono);letter-spacing:.3px}

    .layout{display:flex;max-width:1080px;margin:0 auto;padding:32px;gap:28px;animation:fadeUp .4s ease}
    .main{flex:1;min-width:0}.sidebar{width:230px;flex-shrink:0}

    .sb-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;position:sticky;top:90px}
    .sb-title{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--faint);margin-bottom:16px}
    .sb-list{display:flex;flex-direction:column;gap:3px;margin-bottom:18px}
    .sb-item{padding:10px 12px;border-radius:10px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:12px;border:1px solid transparent}
    .sb-item:hover{background:rgba(255,255,255,.02)}.sb-item.active{background:rgba(255,255,255,.03);border-color:var(--border-hi)}
    .sb-avatar{width:34px;height:34px;border-radius:9px;background:var(--deep);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--faint);flex-shrink:0;transition:color .15s}
    .sb-item.active .sb-avatar{color:var(--text)}
    .sb-sname{font-size:13px;color:var(--dim);font-weight:500;transition:color .15s}.sb-item.active .sb-sname{color:var(--bright)}
    .sb-spack{font-size:9px;color:var(--faint);font-family:var(--mono);letter-spacing:.5px;margin-top:1px}
    .sb-divider{height:1px;background:var(--border);margin:14px 0}
    .sb-add-title{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
    .sb-add-input{width:100%;padding:10px 12px;background:var(--input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-family:var(--sans);outline:none;margin-bottom:8px;transition:border-color .2s}
    .sb-add-input:focus{border-color:#2a2a2a}.sb-add-input::placeholder{color:var(--faint)}
    .sb-add-btn{width:100%;padding:9px;background:var(--deep);border:1px solid #222;border-radius:8px;color:var(--dim);font-family:var(--mono);font-size:10px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.3px}
    .sb-add-btn:hover{background:#222;color:var(--text)}.sb-add-btn:disabled{opacity:.4;cursor:not-allowed}
    .sb-msg{font-size:11px;margin-top:8px;font-family:var(--sans);line-height:1.4}.sb-msg.err{color:var(--red)}.sb-msg.ok{color:var(--green)}
    .sb-empty{color:var(--faint);font-size:11px;text-align:center;padding:20px 0;font-family:var(--mono)}

    .profile{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:30px;margin-bottom:12px}
    .profile-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px}
    .p-name{font-size:26px;font-weight:700;font-family:var(--serif);color:var(--bright);line-height:1.2}
    .p-pkg{margin-top:6px;color:var(--faint);font-size:11px;font-family:var(--mono);letter-spacing:.5px}
    .p-goal-lbl{font-size:9px;color:var(--muted);font-family:var(--mono);font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
    .p-goal{font-size:36px;font-weight:700;font-family:var(--mono);color:var(--bright);line-height:1}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
    .stat{background:var(--input);border:1px solid var(--border);border-radius:10px;padding:14px 12px;text-align:center}
    .stat-lbl{font-size:8px;color:var(--faint);font-family:var(--mono);font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
    .stat-val{font-size:14px;font-weight:700;color:#aaa;font-family:var(--mono)}
    .prog-wrap{margin-bottom:18px}.prog-top{display:flex;justify-content:space-between;margin-bottom:8px}
    .prog-lbl{font-size:8px;color:var(--faint);font-family:var(--mono);font-weight:600;letter-spacing:1.5px;text-transform:uppercase}
    .prog-ct{font-size:11px;color:var(--faint);font-family:var(--mono)}
    .prog-track{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
    .prog-fill{height:100%;background:var(--muted);border-radius:2px;transition:width .6s ease}
    .info-grid{display:grid;grid-template-columns:1fr 2fr;gap:8px}
    .info-box{background:var(--input);border:1px solid var(--border);border-radius:10px;padding:14px}
    .info-lbl{font-size:8px;color:var(--faint);font-family:var(--mono);font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
    .info-val{font-size:12px;color:var(--dim);line-height:1.6}

    .ed{cursor:pointer;border-bottom:1px dashed rgba(255,255,255,.1);padding-bottom:1px;transition:border-color .2s}.ed:hover{border-color:rgba(255,255,255,.25)}
    .ed-inp{background:rgba(201,122,69,.06);border:1px solid rgba(201,122,69,.15);border-radius:6px;padding:4px 8px;outline:none;color:inherit;font:inherit;width:100%}
    .ed-ta{background:rgba(201,122,69,.06);border:1px solid rgba(201,122,69,.15);border-radius:6px;padding:8px 10px;outline:none;color:inherit;font:inherit;width:100%;min-height:60px;resize:vertical}
    .ph{color:var(--faint);font-style:italic}

    .rm-header{display:flex;justify-content:space-between;align-items:baseline;margin:32px 0 16px}
    .rm-title{font-size:18px;font-family:var(--serif);font-weight:700;color:var(--text)}
    .rm-sub{font-size:10px;color:var(--faint);font-family:var(--mono);letter-spacing:.3px}
    .sess-list{display:flex;flex-direction:column;gap:6px}

    .sess{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:all .25s ease}
    .sess.up{border-color:var(--border-hi)}.sess.lk-s{opacity:.55}
    .sess-hd{padding:22px 26px;cursor:pointer;display:flex;align-items:center;gap:18px;user-select:none;transition:background .15s}
    .sess-hd:hover{background:rgba(255,255,255,.01)}
    .sess-num{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:15px;font-weight:700;flex-shrink:0}
    .sess-num.upcoming{background:#141414;border:1px solid rgba(201,122,69,.2);color:var(--bright)}
    .sess-num.completed{background:var(--green-bg);border:1px solid rgba(92,184,92,.1);color:var(--green)}
    .sess-num.locked{background:#0e0e0e;border:1px solid var(--border);color:var(--faint)}
    .sess-info{flex:1;min-width:0}.sess-tr{display:flex;align-items:center;gap:12px;margin-bottom:4px;flex-wrap:wrap}
    .sess-t{font-size:15px;font-weight:600;font-family:var(--serif);color:var(--text)}.sess-t.lk{color:var(--faint)}
    .sess-meta{font-size:11px;color:var(--faint);display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sess-meta .sep{color:#222}
    .chev{width:16px;height:16px;flex-shrink:0;transition:transform .3s ease;stroke:var(--faint)}.chev.open{transform:rotate(180deg)}
    .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:20px;font-size:9px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;font-family:var(--mono)}
    .badge.upcoming{background:var(--deep);color:var(--text)}.badge.completed{background:var(--green-bg);color:var(--green)}.badge.locked{background:#0e0e0e;color:var(--faint)}
    .bdot{width:5px;height:5px;border-radius:50%}.bdot.upcoming{background:var(--accent);animation:pulse 2s infinite}.bdot.completed{background:var(--green)}

    .sess-body{padding:0 26px 26px;border-top:1px solid var(--border);padding-top:20px}
    .tc{display:flex;gap:10px;margin-bottom:16px;align-items:center;padding:8px 14px;background:rgba(255,255,255,.015);border:1px solid var(--border);border-radius:9px}
    .tc-lbl{font-size:9px;color:var(--faint);font-family:var(--mono);font-weight:600;letter-spacing:1.5px}
    .tc-btn{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:6px;border:1px solid #222;background:var(--deep);color:var(--dim);cursor:pointer;font-size:9px;font-family:var(--mono);font-weight:600;margin-left:auto;transition:all .2s;letter-spacing:.5px}
    .tc-btn:hover{border-color:var(--faint);color:var(--text)}
    .slbl{color:var(--faint);font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-family:var(--mono);margin:0 0 12px}
    .slbl .lkn{color:var(--faint);font-weight:500;letter-spacing:1px}
    .desc{color:var(--dim);font-size:13px;line-height:1.8;margin-bottom:22px}
    .g-list{display:flex;flex-direction:column;gap:7px;margin-bottom:22px}
    .g-item{display:flex;align-items:flex-start;gap:10px;color:#999;font-size:13px;line-height:1.5}
    .g-arrow{color:var(--faint);flex-shrink:0;margin-top:2px;font-size:11px}
    .rm-btn{background:none;border:none;color:var(--faint);cursor:pointer;font-size:14px;padding:0 4px;flex-shrink:0;line-height:1;transition:color .15s}.rm-btn:hover{color:var(--dim)}
    .add-b{background:none;border:1px dashed var(--border);border-radius:8px;color:var(--faint);cursor:pointer;padding:9px;font-size:10px;font-family:var(--mono);width:100%;transition:all .2s;letter-spacing:.3px}
    .add-b:hover{border-color:var(--faint);color:var(--muted)}
    .hw-list{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
    .hw{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--input);border-radius:10px;border:1px solid var(--border)}
    .hw.lk{background:rgba(8,8,8,.6);border:1px dashed var(--border)}
    .hw-cb{width:15px;height:15px;border-radius:4px;border:1.5px solid #222;flex-shrink:0}
    .hw-l{color:#aaa;font-size:13px;flex:1;line-height:1.4}.hw-l.lk{color:var(--faint);filter:blur(3px);user-select:none}
    .hw-badge{font-size:8px;padding:3px 8px;border-radius:4px;background:var(--deep);color:var(--muted);font-family:var(--mono);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
    .hw-sel{background:#0e0e0e;color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:3px 6px;font-size:9px;font-family:var(--mono);cursor:pointer;outline:none}
    .hw-attach{background:none;border:1px solid var(--border);border-radius:5px;padding:3px 7px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px;font-size:9px;font-family:var(--mono);color:var(--faint);letter-spacing:.3px;flex-shrink:0}
    .hw-attach:hover{border-color:var(--faint);color:var(--muted)}
    .hw-attach.has{border-color:rgba(201,122,69,.25);color:var(--accent)}
    .hw-attach.has:hover{border-color:rgba(201,122,69,.5)}
    .hw-dl{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;background:rgba(201,122,69,.06);border:1px solid rgba(201,122,69,.15);border-radius:5px;color:var(--accent);font-size:9px;font-family:var(--mono);text-decoration:none;font-weight:600;letter-spacing:.3px;flex-shrink:0;transition:all .2s}
    .hw-dl:hover{background:rgba(201,122,69,.1);border-color:rgba(201,122,69,.3)}
    .tn-box{padding:16px 18px;background:var(--input);border-radius:10px;border-left:2px solid #222;color:#999;font-size:13px;line-height:1.8}
    .footer{text-align:center;padding:40px 0 20px;font-family:var(--mono);font-size:11px;letter-spacing:4px}
    .footer .v{color:var(--accent)}.footer .rest{color:#1a1a1a}
    .loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--faint);font-family:var(--mono);font-size:12px;letter-spacing:1px}
    .empty{text-align:center;padding:80px 20px}.empty h3{font-family:var(--serif);font-size:18px;color:var(--dim);margin-bottom:10px;font-weight:400}.empty p{font-size:13px;color:var(--faint)}

    @media(max-width:768px){
      .layout{flex-direction:column-reverse;padding:20px 16px;gap:20px}
      .sidebar{width:100%}.sb-card{position:static}.nav-links{display:none}
      .stats{grid-template-columns:repeat(2,1fr)}.info-grid{grid-template-columns:1fr}
      .nav{padding:14px 16px}.profile{padding:24px}.p-name{font-size:22px}.p-goal{font-size:28px}
      .edit-banner{padding:8px 16px}
    }
  </style>
</head>
<body>
<div id="app"></div>
<script>
const SB_URL='https://fqshijwiushtrncinjif.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxc2hpandpdXNodHJuY2luamlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5MzIwMDcsImV4cCI6MjA4NjUwODAwN30.tkPgY4oGhjQLzl81MVDG0a1PhjCgcGMQ6HBD0UOPruA';
const db=window.supabase.createClient(SB_URL,SB_KEY);

let S={view:'loading',user:null,profile:null,isTutor:false,students:[],selId:null,student:null,sessions:[],exSess:-1,loginErr:'',loginLoad:false,addEmail:'',addMsg:'',addMsgType:''};

function R(){
  const a=document.getElementById('app');
  if(S.view==='loading')a.innerHTML='<div class="loading">LOADING</div>';
  else if(S.view==='login')a.innerHTML=loginHTML();
  else a.innerHTML=dashHTML();
  bind();
}

function loginHTML(){
  return`<div class="login-wrap"><div class="login-box">
    <div class="logo"><span class="v">V</span><span class="rest">EDARION</span></div>
    <label class="lbl">Email</label><input class="inp" type="email" id="le" placeholder="you@email.com">
    <label class="lbl">Password</label><input class="inp" type="password" id="lp" placeholder="••••••••">
    <button class="btn-primary" id="lb" ${S.loginLoad?'disabled':''}>${S.loginLoad?'Signing in...':'Sign In'}</button>
    <div class="forgot"><a href="#" id="fp">Forgot password?</a></div>
    ${S.loginErr?'<div class="login-err">'+S.loginErr+'</div>':''}
  </div></div>`;
}

async function doLogin(){
  const e=document.getElementById('le').value.trim(),p=document.getElementById('lp').value;
  if(!e||!p){S.loginErr='Please enter email and password';R();return;}
  S.loginLoad=true;S.loginErr='';R();
  const{error}=await db.auth.signInWithPassword({email:e,password:p});
  if(error){S.loginErr='Invalid email or password';S.loginLoad=false;R();return;}
  await loadUser();
}

async function doLogout(){await db.auth.signOut();S={...S,view:'login',user:null,profile:null,isTutor:false,students:[],selId:null,student:null,sessions:[],loginErr:'',exSess:-1};R();}

async function loadUser(){
  const{data:{user}}=await db.auth.getUser();
  if(!user){S.view='login';R();return;}
  S.user=user;
  const{data:prof}=await db.from('profiles').select('*').eq('id',user.id).single();
  S.profile=prof;S.isTutor=prof&&(prof.role==='owner'||prof.role==='tutor');
  if(S.isTutor){
    const{data:sts}=await db.from('students').select('*, profiles!profile_id(first_name, email)').eq('assigned_tutor_id',user.id).order('created_at',{ascending:false});
    S.students=sts||[];
    if(S.students.length>0){S.selId=S.students[0].id;await loadStudent(S.students[0].id);}else{S.student=null;S.sessions=[];}
  }else{
    const{data:sts}=await db.from('students').select('*, profiles!profile_id(first_name, email)').eq('profile_id',user.id);
    if(sts&&sts.length>0){S.students=sts;S.selId=sts[0].id;S.student=sts[0];await loadStudent(sts[0].id);}else{S.student=null;S.sessions=[];}
  }
  S.view='dash';S.loginLoad=false;R();
}

async function loadStudent(id){
  const{data:st}=await db.from('students').select('*, profiles!profile_id(first_name, email)').eq('id',id).single();
  S.student=st;
  const{data:sess}=await db.from('sessions').select('*').eq('student_id',id).order('session_number');
  for(let s of(sess||[])){
    const{data:g}=await db.from('session_goals').select('*').eq('session_id',s.id).order('sort_order');s.goals=g||[];
    const{data:h}=await db.from('homework').select('*').eq('session_id',s.id).order('sort_order');s.homework=h||[];
  }
  S.sessions=sess||[];
}

async function addStudent(){
  const email=S.addEmail.trim().toLowerCase();
  if(!email){S.addMsg='Enter an email';S.addMsgType='err';R();return;}
  const{data:profs}=await db.from('profiles').select('*').eq('email',email);
  if(!profs||profs.length===0){S.addMsg='No account found. Create their account in Supabase first.';S.addMsgType='err';R();return;}
  const{data:existing}=await db.from('students').select('id').eq('profile_id',profs[0].id).eq('assigned_tutor_id',S.user.id);
  if(existing&&existing.length>0){S.addMsg='Already added as your student';S.addMsgType='err';R();return;}
  const{error}=await db.from('students').insert({profile_id:profs[0].id,assigned_tutor_id:S.user.id,package_type:'5-session',sessions_bought:5,status:'active'});
  if(error){S.addMsg='Error: '+error.message;S.addMsgType='err';R();return;}
  S.addMsg=(profs[0].first_name||'Student')+' added!';S.addMsgType='ok';S.addEmail='';
  await loadUser();
}

function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function ed(val,id,ml){
  if(val)return`<span class="ed" data-eid="${id}" data-ml="${ml}">${esc(val)}</span>`;
  return`<span class="ed" data-eid="${id}" data-ml="${ml}"><span class="ph">Click to add...</span></span>`;
}

function dashHTML(){
  const t=S.isTutor,s=S.student;
  const cc=S.sessions.filter(x=>x.status==='completed').length;
  const total=s?s.sessions_bought:0;
  const pct=total>0?Math.max((cc/total)*100,3):3;
  let name='';if(s&&s.profiles)name=s.profiles.first_name||s.profiles.email||'';
  return`
    <div class="nav">
      <div class="nav-left"><span class="logo"><span class="v">V</span><span class="rest">EDARION</span></span><span class="nav-sep">|</span><span class="nav-role">${t?'Tutor':'Student'}</span></div>
      <div class="nav-links"><a href="/Index.html" class="nav-link">Home</a><a href="/learn.html" class="nav-link">Learn</a><a href="/course.html" class="nav-link">Course</a><a href="/foundations/translating-words-on-the-test/vedamark.html" class="nav-link">VedaMark</a></div>
      <div class="nav-right"><span class="nav-user">${S.profile?.first_name||S.user?.email||''}</span><button class="sign-out" id="lo">Sign Out</button></div>
    </div>
    ${t?'<div class="edit-banner"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg><span>Editing mode — click any text to edit</span></div>':''}
    <div class="layout">
      <div class="main">
        ${!s?`<div class="empty"><h3>${t?'Select or add a student':'No roadmap assigned yet'}</h3><p>${t?'Add a student by email in the panel.':'Your tutor will set up your dashboard soon.'}</p></div>`:
        `<div class="profile">
          <div class="profile-top">
            <div><div class="p-name">${t?ed(name,'student-name',false):esc(name)}</div><div class="p-pkg">${t?ed(s.package_type||'5-session','student-package_type',false):esc(s.package_type||'5-session')} Package</div></div>
            <div style="text-align:right"><div class="p-goal-lbl">Goal</div><div class="p-goal">${t?ed(s.goal_score||'','student-goal_score',false):esc(s.goal_score||'—')}</div></div>
          </div>
          <div class="stats">${statBox('Current Avg',s.current_average,'student-current_average',t)}${statBox('LR',s.lr_average,'student-lr_average',t)}${statBox('RC',s.rc_average,'student-rc_average',t)}${statBox('Test Date',s.test_date,'student-test_date',t)}</div>
          <div class="prog-wrap"><div class="prog-top"><span class="prog-lbl">Progress</span><span class="prog-ct">${cc} / ${t?ed(String(total||0),'student-sessions_bought',false):total}</span></div><div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div></div>
          <div class="info-grid">
            <div class="info-box"><div class="info-lbl">Accommodations</div><div class="info-val">${t?ed(s.accommodations||'None','student-accommodations',false):esc(s.accommodations||'None')}</div></div>
            <div class="info-box"><div class="info-lbl">Notes</div><div class="info-val">${t?ed(s.notes||'','student-notes',true):esc(s.notes||'—')}</div></div>
          </div>
        </div>
        <div class="rm-header"><div class="rm-title">${t?'Session Roadmap':'Your Roadmap'}</div><div class="rm-sub">Homework unlocks after each session</div></div>
        <div class="sess-list">
          ${S.sessions.length===0&&t?'<button class="add-b" id="add-first-s">+ Add First Session</button>':''}
          ${S.sessions.map((ss,i)=>sessHTML(ss,i)).join('')}
          ${S.sessions.length>0&&t?'<button class="add-b" id="add-s">+ Add Session</button>':''}
        </div>`}
        <div class="footer"><span class="v">V</span><span class="rest">EDARION</span></div>
      </div>
      ${t?`<div class="sidebar"><div class="sb-card">
        <div class="sb-title">My Students</div>
        <div class="sb-list">${S.students.length===0?'<div class="sb-empty">No students yet</div>':''}${S.students.map(st=>{
          const n=st.profiles?.first_name||st.profiles?.email||'Unnamed';const init=n.charAt(0).toUpperCase();const active=st.id===S.selId;
          return`<div class="sb-item ${active?'active':''}" data-pick="${st.id}"><div class="sb-avatar">${init}</div><div><div class="sb-sname">${esc(n)}</div><div class="sb-spack">${st.package_type||'5-session'}</div></div></div>`;
        }).join('')}</div>
        <div class="sb-divider"></div>
        <div class="sb-add-title">Add Student</div>
        <input class="sb-add-input" id="add-em" type="email" placeholder="student@email.com" value="${esc(S.addEmail)}">
        <button class="sb-add-btn" id="add-btn">Add by Email</button>
        ${S.addMsg?`<div class="sb-msg ${S.addMsgType}">${S.addMsg}</div>`:''}
      </div></div>`:''}
    </div>`;
}

function statBox(lbl,val,eid,t){return`<div class="stat"><div class="stat-lbl">${lbl}</div><div class="stat-val">${t?ed(val||'',eid,false):esc(val||'—')}</div></div>`;}

function sessHTML(ss,i){
  const t=S.isTutor,ex=S.exSess===i,lk=ss.status==='locked',up=ss.status==='upcoming',cp=ss.status==='completed';
  const dt=ss.session_date?new Date(ss.session_date+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
  const lockIco='<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
  let body='';
  if(ex){
    body=`<div class="sess-body">
      ${t?`<div class="tc"><span class="tc-lbl">TUTOR</span><button class="tc-btn" data-cyc="${ss.id}" data-st="${ss.status}">${ss.status.toUpperCase()}</button></div>`:''}
      <div class="desc">${t?ed(ss.description||'','session-'+ss.id+'-description',true):esc(ss.description||'')}</div>
      <div class="slbl">Session Goals</div>
      <div class="g-list">
        ${(ss.goals||[]).map(g=>`<div class="g-item"><span class="g-arrow">→</span>${t?`<span style="flex:1">${ed(g.goal_text,'goal-'+g.id+'-goal_text',false)}</span><button class="rm-btn" data-rg="${g.id}">×</button>`:`<span>${esc(g.goal_text)}</span>`}</div>`).join('')}
        ${t?`<button class="add-b" data-ag="${ss.id}">+ Add Goal</button>`:''}
      </div>
      <div class="slbl">Homework${lk&&!t?' <span class="lkn">— unlocks after session</span>':''}</div>
      <div class="hw-list">
        ${(ss.homework||[]).map(h=>{
          const sl=lk&&!t;
          return`<div class="hw ${sl?'lk':''}">
            ${sl?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#2a2a2a" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>':'<div class="hw-cb"></div>'}
            ${sl?'<span class="hw-l lk">This homework unlocks after the session</span>':t?`<span class="hw-l" style="flex:1">${ed(h.label,'hw-'+h.id+'-label',false)}</span>`:`<span class="hw-l">${esc(h.label)}</span>`}
            ${!sl?(t?`<select class="hw-sel" data-ht="${h.id}"><option value="drill" ${h.hw_type==='drill'?'selected':''}>DRILL</option><option value="link" ${h.hw_type==='link'?'selected':''}>LINK</option><option value="note" ${h.hw_type==='note'?'selected':''}>NOTE</option><option value="pdf" ${h.hw_type==='pdf'?'selected':''}>PDF</option></select><button class="hw-attach ${h.attachment_url?'has':''}" data-ha="${h.id}" title="${h.attachment_url?esc(h.attachment_url):'Attach PDF'}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>${h.attachment_url?'PDF':'Attach'}</button><button class="rm-btn" data-rh="${h.id}">×</button>`:`<span class="hw-badge">${h.hw_type||'drill'}</span>${h.attachment_url?`<a href="${esc(h.attachment_url)}" target="_blank" class="hw-dl"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Worksheet</a>`:''}`):''}          </div>`;
        }).join('')}
        ${t?`<button class="add-b" data-ah="${ss.id}">+ Add Homework</button>`:''}
      </div>
      ${t||ss.tutor_notes?`<div class="slbl">Session Notes${!t?' from Your Tutor':''}</div><div class="tn-box">${t?ed(ss.tutor_notes||'','session-'+ss.id+'-tutor_notes',true):esc(ss.tutor_notes||'')}</div>`:''}
    </div>`;
  }
  return`<div class="sess ${up?'up':''} ${lk&&!t?'lk-s':''}">
    <div class="sess-hd" data-tog="${i}">
      <div class="sess-num ${ss.status}">${cp?'✓':i+1}</div>
      <div class="sess-info">
        <div class="sess-tr">
          ${t?`<span class="sess-t">${ed(ss.title,'session-'+ss.id+'-title',false)}</span>`:`<span class="sess-t ${lk?'lk':''}">${esc(ss.title)}</span>`}
          <span class="badge ${ss.status}">${cp?'<span class="bdot completed"></span> Completed':''}${up?'<span class="bdot upcoming"></span> Up Next':''}${lk?lockIco+' Upcoming':''}</span>
        </div>
        <div class="sess-meta">
          ${t?`<span>${ed(ss.subtitle||'','session-'+ss.id+'-subtitle',false)}</span>`:`<span>${esc(ss.subtitle||'')}</span>`}
          <span class="sep">·</span>
          ${t?`<span>${ed(ss.session_date||'','session-'+ss.id+'-session_date',false)}</span>`:`<span>${dt}</span>`}
        </div>
      </div>
      <svg class="chev ${ex?'open':''}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
    </div>${body}</div>`;
}

function bind(){
  document.getElementById('lb')?.addEventListener('click',doLogin);
  document.getElementById('lp')?.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  document.getElementById('le')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('lp')?.focus();});
  document.getElementById('fp')?.addEventListener('click',async e=>{
    e.preventDefault();const em=document.getElementById('le')?.value.trim();
    if(!em){S.loginErr='Enter your email first';R();return;}
    await db.auth.resetPasswordForEmail(em,{redirectTo:location.origin+'/dashboard.html'});
    alert('Password reset link sent to '+em);
  });
  document.getElementById('lo')?.addEventListener('click',doLogout);
  document.querySelectorAll('[data-pick]').forEach(el=>{el.addEventListener('click',async()=>{S.selId=el.dataset.pick;S.exSess=-1;S.addMsg='';await loadStudent(el.dataset.pick);R();});});
  document.getElementById('add-em')?.addEventListener('input',function(){S.addEmail=this.value;});
  document.getElementById('add-em')?.addEventListener('keydown',e=>{if(e.key==='Enter')addStudent();});
  document.getElementById('add-btn')?.addEventListener('click',addStudent);
  document.querySelectorAll('[data-tog]').forEach(el=>{el.addEventListener('click',e=>{if(e.target.closest('.ed')||e.target.closest('.ed-inp')||e.target.closest('.ed-ta'))return;const i=parseInt(el.dataset.tog);S.exSess=S.exSess===i?-1:i;R();});});
  document.querySelectorAll('.ed').forEach(el=>{el.addEventListener('click',e=>{e.stopPropagation();startEd(el);});});
  document.querySelectorAll('[data-cyc]').forEach(b=>{b.addEventListener('click',async e=>{e.stopPropagation();const order=['locked','upcoming','completed'];const next=order[(order.indexOf(b.dataset.st)+1)%3];await db.from('sessions').update({status:next}).eq('id',b.dataset.cyc);await loadStudent(S.selId);R();});});
  document.querySelectorAll('[data-ag]').forEach(b=>{b.addEventListener('click',async()=>{const sid=b.dataset.ag;const ms=S.sessions.find(s=>s.id===sid)?.goals?.length||0;await db.from('session_goals').insert({session_id:sid,goal_text:'New goal',sort_order:ms});await loadStudent(S.selId);R();});});
  document.querySelectorAll('[data-rg]').forEach(b=>{b.addEventListener('click',async()=>{await db.from('session_goals').delete().eq('id',b.dataset.rg);await loadStudent(S.selId);R();});});
  document.querySelectorAll('[data-ah]').forEach(b=>{b.addEventListener('click',async()=>{const sid=b.dataset.ah;const ms=S.sessions.find(s=>s.id===sid)?.homework?.length||0;await db.from('homework').insert({session_id:sid,label:'New assignment',hw_type:'drill',sort_order:ms});await loadStudent(S.selId);R();});});
  document.querySelectorAll('[data-rh]').forEach(b=>{b.addEventListener('click',async()=>{await db.from('homework').delete().eq('id',b.dataset.rh);await loadStudent(S.selId);R();});});
  document.querySelectorAll('[data-ht]').forEach(sel=>{sel.addEventListener('change',async function(){await db.from('homework').update({hw_type:this.value}).eq('id',this.dataset.ht);});});
  document.querySelectorAll('[data-ha]').forEach(b=>{b.addEventListener('click',async e=>{e.stopPropagation();const cur=b.title!=='Attach PDF'?b.title:'';const url=prompt('Paste PDF or worksheet URL (leave empty to remove):',cur);if(url===null)return;await db.from('homework').update({attachment_url:url||null}).eq('id',b.dataset.ha);await loadStudent(S.selId);R();});});
  const ab=document.getElementById('add-s')||document.getElementById('add-first-s');
  if(ab)ab.addEventListener('click',async()=>{const n=S.sessions.length+1;await db.from('sessions').insert({student_id:S.selId,session_number:n,title:'Session '+n,subtitle:'',description:'',status:n===1?'upcoming':'locked'});await loadStudent(S.selId);R();});
}

function startEd(el){
  const eid=el.dataset.eid,ml=el.dataset.ml==='true';
  const cur=el.textContent==='Click to add...'?'':el.textContent;
  if(ml)el.outerHTML=`<textarea class="ed-ta" data-eid="${eid}">${esc(cur)}</textarea>`;
  else el.outerHTML=`<input class="ed-inp" data-eid="${eid}" value="${esc(cur).replace(/"/g,'&quot;')}">`;
  const inp=document.querySelector(`[data-eid="${eid}"]`);inp.focus();
  inp.addEventListener('blur',()=>saveEd(eid,inp.value));
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!ml)saveEd(eid,inp.value);if(e.key==='Escape'){loadStudent(S.selId).then(R);}});
}

async function saveEd(eid,val){
  const p=eid.split('-');
  if(p[0]==='student'){if(p[1]==='name')await db.from('profiles').update({first_name:val}).eq('id',S.student.profile_id);else{const v=p[1]==='sessions_bought'?parseInt(val)||0:val;await db.from('students').update({[p[1]]:v}).eq('id',S.selId);}}
  else if(p[0]==='session')await db.from('sessions').update({[p[2]]:val}).eq('id',p[1]);
  else if(p[0]==='goal')await db.from('session_goals').update({[p[2]]:val}).eq('id',p[1]);
  else if(p[0]==='hw')await db.from('homework').update({[p[2]]:val}).eq('id',p[1]);
  await loadStudent(S.selId);R();
}

async function init(){const{data:{session}}=await db.auth.getSession();if(session)await loadUser();else{S.view='login';R();}}
init();
</script>
