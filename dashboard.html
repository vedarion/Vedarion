<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEDARION — My Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#080808;--surface:#0d0d0d;--border:#181818;--border-hi:#232323;
      --text:#c8c8c8;--bright:#e8e8e8;--dim:#666;--muted:#444;--faint:#2a2a2a;
      --accent:#c97a45;
      --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--serif:'Libre Baskerville',Georgia,serif;
    }
    body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#1a1a1a;border-radius:2px}

    .ann-bar{background:rgba(201,122,69,.06);border-bottom:1px solid rgba(201,122,69,.1);padding:10px 32px;display:flex;align-items:center;justify-content:center;gap:12px;position:relative}
    .ann-bar.hidden{display:none}
    .ann-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite;flex-shrink:0}
    .ann-text{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.4px}
    .ann-text a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;transition:opacity .2s}
    .ann-text a:hover{opacity:.7}
    .ann-close{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px 8px;line-height:1;transition:color .2s}
    .ann-close:hover{color:var(--dim)}

    .nav{padding:16px 36px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:rgba(8,8,8,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:sticky;top:0;z-index:100}
    .logo{font-family:var(--mono);font-weight:700;letter-spacing:4px;font-size:13px;text-decoration:none}
    .logo .v{color:var(--accent)}.logo .rest{color:var(--bright)}
    .nav-left{display:flex;align-items:center;gap:20px}
    .nav-links{display:flex;gap:2px}
    .nav-link{padding:5px 12px;color:var(--dim);font-family:var(--mono);font-size:11px;text-decoration:none;border-radius:5px;transition:color .2s;letter-spacing:.3px}
    .nav-link:hover{color:var(--bright)}
    .nav-right{display:flex;align-items:center;gap:12px}
    .nav-user{color:var(--muted);font-size:11px;font-family:var(--mono)}
    .sign-out{padding:5px 12px;background:transparent;border:1px solid var(--border-hi);border-radius:6px;color:var(--dim);font-family:var(--mono);font-size:10px;cursor:pointer;transition:all .2s;letter-spacing:.3px}
    .sign-out:hover{color:var(--text);border-color:var(--muted)}

    .loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--faint);font-family:var(--mono);font-size:12px;letter-spacing:1px}

    .hub-wrap{max-width:980px;margin:0 auto;padding:60px 36px 100px}

    .greeting{margin-bottom:48px;animation:fadeUp .4s ease both}
    .greeting-name{font-family:var(--serif);font-size:32px;color:var(--bright);line-height:1.2;margin-bottom:6px;font-weight:400;font-style:italic}
    .greeting-sub{font-size:13px;color:var(--dim);font-family:var(--mono);letter-spacing:.5px}

    .cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;animation:fadeUp .4s .08s ease both}

    .pcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;display:flex;flex-direction:column;transition:border-color .2s}
    .pcard:hover{border-color:var(--border-hi)}

    .pcard-label{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
    .pcard-title{font-family:var(--serif);font-size:18px;color:var(--bright);line-height:1.3;margin-bottom:6px;font-weight:400}
    .pcard-sub{font-size:12px;color:var(--dim);font-family:var(--mono);letter-spacing:.3px;margin-bottom:20px}
    .pcard-divider{height:1px;background:var(--border);margin:0 0 20px}
    .pcard-body{font-size:13px;color:var(--dim);line-height:1.75}
    .spacer{flex:1;min-height:16px}

    .course-list{display:flex;flex-direction:column}
    .course-item{padding:12px 0;border-bottom:1px solid var(--border)}
    .course-item:last-child{border-bottom:none;padding-bottom:0}
    .course-name{font-size:13px;color:var(--text);font-weight:500;margin-bottom:3px}
    .course-meta{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.3px;line-height:1.7}
    .course-price{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}

    .roadmap-preview{display:flex;flex-direction:column}
    .rm-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
    .rm-row:last-child{border-bottom:none;padding-bottom:0}
    .rm-key{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
    .rm-val{font-size:13px;color:var(--bright)}
    .rm-val.accent{color:var(--accent)}
    .prog-wrap{padding:12px 0 4px}
    .prog-track{height:2px;background:var(--faint);border-radius:1px;overflow:hidden}
    .prog-fill{height:100%;background:var(--accent);border-radius:1px;opacity:.65;transition:width .6s ease}

    .method-section{display:flex;flex-direction:column;gap:8px;padding:2px 0}
    .method-tag{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
    .method-tag.adv{color:var(--accent);opacity:.75}
    .method-section-title{font-size:14px;color:var(--bright);font-weight:600;line-height:1.3}
    .method-section-body{font-size:12px;color:var(--dim);line-height:1.7}
    .method-link{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--muted);text-decoration:none;letter-spacing:.3px;transition:color .2s;margin-top:4px}
    .method-link:hover{color:var(--text)}
    .method-link svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .method-sep{height:1px;background:var(--border);margin:16px 0}

    .pcard-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:8px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.5px;text-decoration:none;cursor:pointer;transition:all .2s;border:none;width:100%;margin-top:20px}
    .pcard-btn.ghost{background:transparent;border:1px solid var(--border-hi);color:var(--dim)}
    .pcard-btn.ghost:hover{border-color:var(--muted);color:var(--text)}
    .pcard-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;opacity:.6}

    .hub-footer{text-align:center;padding:48px 0 0;font-family:var(--mono);font-size:10px;letter-spacing:4px;color:#1e1e1e}
    .hub-footer .v{color:rgba(201,122,69,.2)}

    @media(max-width:820px){
      .cards-grid{grid-template-columns:1fr}
      .hub-wrap{padding:40px 20px 60px}
      .greeting-name{font-size:26px}
      .nav{padding:14px 20px}
      .nav-links{display:none}
      .ann-bar{padding:10px 40px 10px 16px}
    }
  </style>
</head>
<body>

<!-- ANNOUNCEMENT BAR — edit text here -->
<div class="ann-bar" id="ann-bar">
  <div class="ann-dot"></div>
  <div class="ann-text">
    Live classes starting <strong>April 2026</strong> —
    <a href="/course.html">Foundation &amp; Advanced now open for enrollment →</a>
  </div>
  <button class="ann-close" id="ann-close">×</button>
</div>

<div id="app">
  <div class="loading">LOADING</div>
</div>

<script>
const SB_URL='https://fqshijwiushtrncinjif.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxc2hpandpdXNodHJuY2luamlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5MzIwMDcsImV4cCI6MjA4NjUwODAwN30.tkPgY4oGhjQLzl81MVDG0a1PhjCgcGMQ6HBD0UOPruA';
const db=window.supabase.createClient(SB_URL,SB_KEY);

let H={user:null,profile:null,student:null,sessions:[]};

document.getElementById('ann-close').addEventListener('click',()=>{
  document.getElementById('ann-bar').classList.add('hidden');
});

function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function arrow(){return`<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`;}

function render(){
  const p=H.profile;
  const s=H.student;
  const name=p?.first_name||(H.user?.email?.split('@')[0])||'there';
  const hasTutor=!!(s&&s.assigned_tutor_id);
  const sessions=H.sessions||[];
  const completed=sessions.filter(x=>x.status==='completed'&&x.session_number>0).length;
  const total=s?.sessions_bought||0;
  const pct=total>0?Math.max((completed/total)*100,4):4;
  const next=sessions.find(x=>x.status==='upcoming');

  const tutoringCard=hasTutor
    ?`<div class="pcard">
        <div class="pcard-label">1-on-1 Tutoring</div>
        <div class="pcard-title">Your Roadmap</div>
        <div class="pcard-sub">Active</div>
        <div class="pcard-divider"></div>
        <div class="roadmap-preview">
          <div class="rm-row">
            <span class="rm-key">Goal</span>
            <span class="rm-val accent">${esc(s.goal_score||'—')}</span>
          </div>
          <div class="rm-row">
            <span class="rm-key">Sessions</span>
            <span class="rm-val">${completed} of ${total} complete</span>
          </div>
          ${next?`<div class="rm-row">
            <span class="rm-key">Up Next</span>
            <span class="rm-val">${esc(next.title)}</span>
          </div>`:''}
          <div class="prog-wrap">
            <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
          </div>
        </div>
        <div class="spacer"></div>
        <a href="/roadmap.html" class="pcard-btn ghost">Open Roadmap ${arrow()}</a>
      </div>`
    :`<div class="pcard">
        <div class="pcard-label">1-on-1 Tutoring</div>
        <div class="pcard-title">Roadmap &amp; Homework</div>
        <div class="pcard-sub">Not enrolled · $200 / session</div>
        <div class="pcard-divider"></div>
        <div class="pcard-body">A personal session roadmap, smart homework cards, and interactive worksheets that track exactly where you're losing points. Every session is targeted.</div>
        <div class="spacer"></div>
        <a href="https://calendly.com/vedarion-tutoring/free-15min-lsatgameplancall" target="_blank" class="pcard-btn ghost">Book a Free Consultation ${arrow()}</a>
      </div>`;

  document.getElementById('app').innerHTML=`
    <nav class="nav">
      <div class="nav-left">
        <a href="/Index.html" class="logo"><span class="v">V</span><span class="rest">EDARION</span></a>
        <div class="nav-links">
          <a href="/Index.html" class="nav-link">Home</a>
          <a href="/learn.html" class="nav-link">Learn</a>
          <a href="/roadmap.html" class="nav-link">Roadmap</a>
        </div>
      </div>
      <div class="nav-right">
        <span class="nav-user">${esc(p?.first_name||H.user?.email||'')}</span>
        <button class="sign-out" id="sign-out-btn">Sign Out</button>
      </div>
    </nav>

    <div class="hub-wrap">
      <div class="greeting">
        <div class="greeting-name">Welcome back, ${esc(name)}.</div>
        <div class="greeting-sub">Your LSAT journey at a glance</div>
      </div>

      <div class="cards-grid">

        <div class="pcard">
          <div class="pcard-label">Self-Paced</div>
          <div class="pcard-title">The VEDARION Method</div>
          <div class="pcard-sub">Free access · In progress</div>
          <div class="pcard-divider"></div>
          <div class="method-section">
            <div class="method-tag">Foundation</div>
            <div class="method-section-title">Core Pattern Recognition</div>
            <div class="method-section-body">Conditional logic, the core argument framework, and the system that makes every question type predictable. Start here.</div>
            <a href="/learn.html" class="method-link">Start here ${arrow()}</a>
          </div>
          <div class="method-sep"></div>
          <div class="method-section">
            <div class="method-tag adv">Advanced</div>
            <div class="method-section-title">Advanced Pattern Recognition</div>
            <div class="method-section-body">Deep pattern libraries, 4–5 star question strategies, and the traps that stop students at 168. For students already in the 160s.</div>
            <a href="/learn.html#advanced" class="method-link">Skip to advanced ${arrow()}</a>
          </div>
        </div>

        <div class="pcard">
          <div class="pcard-label">Live Instruction</div>
          <div class="pcard-title">Live Classes</div>
          <div class="pcard-sub">Starting April 2026</div>
          <div class="pcard-divider"></div>
          <div class="course-list">
            <div class="course-item">
              <div class="course-name">Foundation — Ground Zero</div>
              <div class="course-meta">Sun &amp; Thu · 7–9 PM CST · 4 weeks</div>
              <div class="course-price">$700</div>
            </div>
            <div class="course-item">
              <div class="course-name">Advanced — Pattern Recognition</div>
              <div class="course-meta">Sat &amp; Sun · 10 AM–12 PM CST · 4 weeks</div>
              <div class="course-price">$800</div>
            </div>
          </div>
          <div class="spacer"></div>
          <a href="/course.html" class="pcard-btn ghost">View Courses ${arrow()}</a>
        </div>

        ${tutoringCard}

      </div>

      <div class="hub-footer"><span class="v">V</span><span>EDARION</span></div>
    </div>
  `;

  document.getElementById('sign-out-btn').addEventListener('click',async()=>{
    await db.auth.signOut();
    window.location.href='/roadmap.html';
  });
}

async function init(){
  const{data:{session}}=await db.auth.getSession();
  if(!session){window.location.href='/roadmap.html';return;}
  H.user=session.user;

  const{data:prof}=await db.from('profiles').select('*').eq('id',H.user.id).single();
  H.profile=prof;

  const{data:sts}=await db.from('students').select('*').eq('profile_id',H.user.id).limit(1);
  H.student=sts&&sts.length>0?sts[0]:null;

  if(H.student&&H.student.assigned_tutor_id){
    const{data:sess}=await db.from('sessions')
      .select('id,title,status,session_number')
      .eq('student_id',H.student.id)
      .order('session_number');
    H.sessions=sess||[];
  }

  render();
}

init();
</script>
</body>
</html>
