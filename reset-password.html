<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — VEDARION</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #0A0A0A;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #fff;
        }
        .nav { display: flex; justify-content: space-between; align-items: center; padding: 30px 50px; }
        .nav-brand { font-size: 24px; font-weight: 300; letter-spacing: 4px; color: white; text-decoration: none; }
        .nav-brand .v-accent { color: #C65D3B; font-weight: 700; }
        .nav-links { display: flex; gap: 40px; }
        .nav-links a { color: #888; text-decoration: none; font-size: 14px; letter-spacing: 1px; transition: color 0.3s ease; }
        .nav-links a:hover { color: white; }
        .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .auth-card { width: 100%; max-width: 420px; }
        .auth-card h1 { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; letter-spacing: 2px; margin-bottom: 8px; }
        .auth-card .subtitle { color: #666; font-size: 14px; letter-spacing: 0.5px; margin-bottom: 40px; }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #888; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 14px 16px; background: #111; border: 1px solid #222; color: #fff; font-size: 15px; outline: none; transition: border-color 0.3s ease; }
        .form-group input:focus { border-color: #C65D3B; }
        .form-group input::placeholder { color: #444; }
        .submit-btn { width: 100%; padding: 16px; background: #C65D3B; color: white; border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: background 0.3s ease; margin-top: 8px; }
        .submit-btn:hover { background: #A04D2E; }
        .submit-btn:disabled { background: #333; cursor: not-allowed; }
        .auth-footer { text-align: center; margin-top: 30px; font-size: 14px; color: #666; }
        .auth-footer a { color: #C65D3B; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }
        .error-msg { background: rgba(198,93,59,0.1); border: 1px solid rgba(198,93,59,0.3); color: #C65D3B; padding: 12px 16px; font-size: 13px; margin-bottom: 20px; display: none; }
        .success-msg { background: rgba(59,198,93,0.1); border: 1px solid rgba(59,198,93,0.3); color: #3bc65d; padding: 12px 16px; font-size: 13px; margin-bottom: 20px; display: none; }
        .divider { height: 1px; background: #222; margin: 30px 0; }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html" class="nav-brand"><span class="v-accent">V</span>EDARION</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Sign In</a>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>Reset Password</h1>
            <p class="subtitle">Enter your email and we'll send a reset link.</p>
            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg"></div>
            <form id="resetForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">Send Reset Link</button>
            </form>
            <div class="divider"></div>
            <div class="auth-footer">
                Remember your password? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script>
        const form = document.getElementById('resetForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'SENDING...';

            const email = document.getElementById('email').value.trim();

            try {
                const { error } = await vedarionAuth.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/login.html'
                });
                if (error) throw error;
                successMsg.textContent = 'Check your email for a password reset link.';
                successMsg.style.display = 'block';
                form.reset();
            } catch (err) {
                errorMsg.textContent = err.message || 'Something went wrong.';
                errorMsg.style.display = 'block';
            }

            submitBtn.disabled = false;
            submitBtn.textContent = 'SEND RESET LINK';
        });
    </script>
</body>
</html>
