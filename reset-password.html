<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — VEDARION</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #0A0A0A;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #fff;
        }
        .nav { display: flex; justify-content: space-between; align-items: center; padding: 30px 50px; }
        .nav-brand { font-size: 24px; font-weight: 300; letter-spacing: 4px; color: white; text-decoration: none; }
        .nav-brand .v-accent { color: #C65D3B; font-weight: 700; }
        .nav-links { display: flex; gap: 40px; }
        .nav-links a { color: #888; text-decoration: none; font-size: 14px; letter-spacing: 1px; transition: color 0.3s ease; }
        .nav-links a:hover { color: white; }
        .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .auth-card { width: 100%; max-width: 420px; }
        .auth-card h1 { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; letter-spacing: 2px; margin-bottom: 8px; }
        .auth-card .subtitle { color: #666; font-size: 14px; letter-spacing: 0.5px; margin-bottom: 40px; }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #888; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 14px 16px; background: #111; border: 1px solid #222; color: #fff; font-size: 15px; outline: none; transition: border-color 0.3s ease; }
        .form-group input:focus { border-color: #C65D3B; }
        .form-group input::placeholder { color: #444; }
        .submit-btn { width: 100%; padding: 16px; background: #C65D3B; color: white; border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: background 0.3s ease; margin-top: 8px; }
        .submit-btn:hover { background: #A04D2E; }
        .submit-btn:disabled { background: #333; cursor: not-allowed; }
        .auth-footer { text-align: center; margin-top: 30px; font-size: 14px; color: #666; }
        .auth-footer a { color: #C65D3B; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }
        .error-msg { background: rgba(198,93,59,0.1); border: 1px solid rgba(198,93,59,0.3); color: #C65D3B; padding: 12px 16px; font-size: 13px; margin-bottom: 20px; display: none; }
        .success-msg { background: rgba(59,198,93,0.1); border: 1px solid rgba(59,198,93,0.3); color: #3bc65d; padding: 12px 16px; font-size: 13px; margin-bottom: 20px; display: none; }
        .divider { height: 1px; background: #222; margin: 30px 0; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html" class="nav-brand"><span class="v-accent">V</span>EDARION</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Sign In</a>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">

            <!-- MODE 1: request a reset email -->
            <div id="requestMode">
                <h1>Reset Password</h1>
                <p class="subtitle">Enter your email and we'll send a reset link.</p>
                <div class="error-msg" id="errorMsg"></div>
                <div class="success-msg" id="successMsg"></div>
                <form id="resetForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>
                    <button type="submit" class="submit-btn" id="submitBtn">Send Reset Link</button>
                </form>
                <div class="divider"></div>
                <div class="auth-footer">
                    Remember your password? <a href="login.html">Sign in</a>
                </div>
            </div>

            <!-- MODE 2: arrived from the email link — set a new password -->
            <div id="setMode" class="hidden">
                <h1>Set New Password</h1>
                <p class="subtitle">Choose a new password for your account.</p>
                <div class="error-msg" id="setErrorMsg"></div>
                <div class="success-msg" id="setSuccessMsg"></div>
                <form id="setForm">
                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" id="newPass" placeholder="At least 8 characters" autocomplete="new-password" required>
                    </div>
                    <div class="form-group">
                        <label>Confirm New Password</label>
                        <input type="password" id="newPass2" autocomplete="new-password" required>
                    </div>
                    <button type="submit" class="submit-btn" id="setBtn">Set New Password</button>
                </form>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script>
        const requestMode = document.getElementById('requestMode');
        const setMode = document.getElementById('setMode');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const setErrorMsg = document.getElementById('setErrorMsg');
        const setSuccessMsg = document.getElementById('setSuccessMsg');

        function showSetMode() {
            requestMode.classList.add('hidden');
            setMode.classList.remove('hidden');
        }

        // Capture recovery markers from the URL up front, before the Supabase
        // client's detectSessionInUrl consumes and clears them. A recovery link
        // may arrive as a hash (#type=recovery&access_token=...) or as a query
        // (?code=... / ?token_hash=...&type=recovery), depending on the flow.
        const hashParams = new URLSearchParams(window.location.hash.slice(1));
        const queryParams = new URLSearchParams(window.location.search);
        const arrivedFromRecovery =
            hashParams.get('type') === 'recovery' ||
            queryParams.get('type') === 'recovery' ||
            !!queryParams.get('code') ||
            !!queryParams.get('token_hash');

        // Show the set-password form immediately if we can already tell we're on
        // a recovery landing.
        if (arrivedFromRecovery) showSetMode();

        // Supabase reports the recovery landing as PASSWORD_RECOVERY, or — when
        // the URL carried no detectable type (PKCE / verify redirect) — as a
        // plain SIGNED_IN. Either way, if we arrived from the email link, show
        // the form. This page never redirects a signed-in user away.
        vedarionAuth.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY') showSetMode();
            else if (event === 'SIGNED_IN' && session && arrivedFromRecovery) showSetMode();
        });

        // Surface an expired/invalid-link error if Supabase returned one.
        (() => {
            const errDesc = hashParams.get('error_description') || queryParams.get('error_description');
            if (errDesc) {
                errorMsg.textContent = errDesc.replace(/\+/g, ' ') +
                    ' — request a fresh link below.';
                errorMsg.style.display = 'block';
            }
        })();

        // ----- MODE 1: send the email -----
        const form = document.getElementById('resetForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'SENDING...';

            const email = document.getElementById('email').value.trim();

            try {
                const { error } = await vedarionAuth.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/reset-password.html'
                });
                if (error) throw error;
                successMsg.textContent = 'Check your email for a password reset link.';
                successMsg.style.display = 'block';
                form.reset();
            } catch (err) {
                errorMsg.textContent = err.message || 'Something went wrong.';
                errorMsg.style.display = 'block';
            }

            submitBtn.disabled = false;
            submitBtn.textContent = 'SEND RESET LINK';
        });

        // ----- MODE 2: save the new password -----
        const setForm = document.getElementById('setForm');
        const setBtn = document.getElementById('setBtn');

        setForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            setErrorMsg.style.display = 'none';
            setSuccessMsg.style.display = 'none';
            const p1 = document.getElementById('newPass').value;
            const p2 = document.getElementById('newPass2').value;
            if (p1.length < 8) { setErrorMsg.textContent = 'Password must be at least 8 characters.'; setErrorMsg.style.display = 'block'; return; }
            if (p1 !== p2) { setErrorMsg.textContent = 'Passwords do not match.'; setErrorMsg.style.display = 'block'; return; }
            setBtn.disabled = true;
            setBtn.textContent = 'SAVING...';
            const { error } = await vedarionAuth.auth.updateUser({ password: p1 });
            setBtn.disabled = false;
            setBtn.textContent = 'SET NEW PASSWORD';
            if (error) { setErrorMsg.textContent = error.message; setErrorMsg.style.display = 'block'; return; }
            setSuccessMsg.innerHTML = 'Password updated. <a href="login.html" style="color:#3bc65d;">Sign in</a> with your new password.';
            setSuccessMsg.style.display = 'block';
            setForm.style.display = 'none';
        });
    </script>
</body>
</html>
