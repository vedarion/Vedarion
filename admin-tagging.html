<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEDARION · Admin · Tagging</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --cream: #FAF8F5;
    --cream-warm: #FDF5F1;
    --orange: #C65D3B;
    --orange-dark: #A34A2D;
    --ink: #2B2B2B;
    --ink-soft: #6B6560;
    --line: #E8E2DB;
    --green: #3E7A52;
    --red: #A33B3B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--cream); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px; border-bottom: 1px solid var(--line); background: #fff;
    position: sticky; top: 0; z-index: 5;
  }
  .logo { font-family: Georgia, serif; font-size: 18px; letter-spacing: 1px; }
  .logo .v { color: var(--orange); }
  .logo .crumb { color: var(--ink-soft); font-family: -apple-system, sans-serif; font-size: 13px; letter-spacing: 0; margin-left: 10px; }
  .counter { font-size: 13px; color: var(--ink-soft); }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 24px 20px 100px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 22px; margin-bottom: 16px; }
  h1 { font-family: Georgia, serif; font-size: 22px; font-weight: 500; margin-bottom: 6px; }
  .sub { color: var(--ink-soft); font-size: 14px; line-height: 1.6; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
  input[type=email], input[type=password] {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 15px; background: var(--cream);
  }
  select {
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; background: #fff; max-width: 100%;
  }
  input:focus, select:focus { outline: 2px solid var(--orange); outline-offset: 1px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 20px; border-radius: 8px; border: 1px solid var(--orange);
    background: var(--orange); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { background: var(--orange-dark); }
  .btn.secondary { background: #fff; color: var(--orange-dark); }
  .btn.secondary:hover { background: var(--cream-warm); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .hidden { display: none; }
  .toolrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .toolrow .spacer { flex: 1; }
  .layout { display: flex; gap: 16px; align-items: flex-start; }
  .sidebar {
    width: 200px; flex-shrink: 0; background: #fff; border: 1px solid var(--line);
    border-radius: 12px; padding: 6px 0;
    position: sticky; top: 76px; max-height: calc(100vh - 100px); overflow-y: auto;
  }
  .sidebar:empty { display: none; }
  .sside-h {
    font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
    color: var(--ink-soft); padding: 10px 12px 4px;
  }
  .sside-h + .sside-h, .srow + .sside-h { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; }
  .srow {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 6px 12px 6px 9px; border: 0; background: none; font-size: 13px; cursor: pointer;
    border-left: 3px solid transparent; color: var(--ink); font-family: inherit;
  }
  .srow:hover { background: var(--cream-warm); }
  .srow.current { background: var(--cream-warm); border-left-color: var(--orange); }
  .sdot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--ink-soft); flex-shrink: 0; }
  .srow.tagged .sdot { background: var(--orange); border-color: var(--orange); }
  .snum { font-weight: 600; min-width: 20px; }
  .stags {
    color: var(--ink-soft); font-size: 11.5px; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .main { flex: 1; min-width: 0; }
  .itembox {
    background: var(--cream); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; font-size: 15px; line-height: 1.75; margin-bottom: 18px;
  }
  .itembox .itemmeta { font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; }
  .stim { margin-bottom: 14px; }
  .stem { font-weight: 600; margin-bottom: 12px; }
  .opt { display: flex; gap: 10px; padding: 5px 0; }
  .opt .letter { font-weight: 600; color: var(--orange-dark); min-width: 18px; }
  .dimlabel { font-size: 13px; font-weight: 600; margin: 16px 0 8px; }
  .dimlabel span { font-weight: 400; color: var(--ink-soft); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: #fff; font-size: 13px; cursor: pointer; user-select: none;
  }
  .chip:hover { border-color: var(--orange); }
  .chip.on { background: var(--orange); border-color: var(--orange); color: #fff; }
  .chip.addnew { border-style: dashed; color: var(--ink-soft); }
  .actionbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line);
  }
  .hint { font-size: 12px; color: var(--ink-soft); }
  .actions { display: flex; gap: 8px; align-items: center; }
  #authError, #tagError { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 18px; }
  .savedFlash { color: var(--green); font-size: 13px; }
  .rawfallback {
    font-family: ui-monospace, Menlo, monospace; font-size: 12px;
    background: #fff; border: 1px dashed var(--line); border-radius: 8px;
    padding: 10px; white-space: pre-wrap; word-break: break-word;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><span class="v">V</span>EDARION<span class="crumb">/ admin / tagging</span></div>
  <span class="counter" id="globalCounter"></span>
</div>

<div class="wrap">

  <!-- ============ AUTH ============ -->
  <div id="authView" class="card" style="max-width: 440px; margin: 50px auto;">
    <h1>Sign in</h1>
    <p class="sub">Tagging is admin-only.</p>
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username">
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password">
    <div id="authError"></div>
    <button class="btn" id="signInBtn" style="margin-top:14px;">Sign in</button>
  </div>

  <!-- ============ TAGGING ============ -->
  <div id="tagView" class="hidden">

    <div class="toolrow">
      <select id="moduleSelect"><option>Loading modules…</option></select>
      <select id="sectionSelect"><option value="">Label a section…</option></select>
      <span id="secTypeButtons" class="chips hidden" style="align-items:center;">
        <span class="hint">This section is:</span>
        <button type="button" class="chip" data-type="LR">LR</button>
        <button type="button" class="chip" data-type="RC">RC</button>
        <button type="button" class="chip" data-type="Other">Other</button>
      </span>
      <select id="advanceSelect">
        <option value="untagged">Save jumps to next untagged</option>
        <option value="order">Save goes to next in order</option>
      </select>
      <div class="spacer"></div>
      <span class="counter" id="moduleCounter"></span>
    </div>

    <div class="layout">
      <div class="sidebar" id="sidebar"></div>

      <div class="main">
        <div class="card" id="itemCard">
          <div class="itembox" id="itemBox">
            <p class="sub">Pick a module to begin.</p>
          </div>

          <div id="dimensionsArea"></div>
          <div id="tagError"></div>

          <div class="actionbar">
            <span class="hint">Enter = save · ← → = move without saving · 1–5 = difficulty · click any question on the left to jump to it</span>
            <div class="actions">
              <span class="savedFlash hidden" id="savedFlash">Saved</span>
              <button class="btn secondary" id="prevBtn">← Back</button>
              <button class="btn secondary" id="skipBtn">Skip →</button>
              <button class="btn" id="saveBtn">Save →</button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const SUPABASE_URL = 'https://fqshijwiushtrncinjif.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxc2hpandpdXNodHJuY2luamlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5MzIwMDcsImV4cCI6MjA4NjUwODAwN30.tkPgY4oGhjQLzl81MVDG0a1PhjCgcGMQ6HBD0UOPruA';

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

let dimensions = [];        // [{id, name, allows_multiple, values: [{id, value}]}]
let allModuleItems = [];    // all items of the current module, in section/position order
let tagsByItem = {};        // item_id -> Set(tag_value_id)
let idx = 0;                // index into allModuleItems — navigation is NEVER filtered
let selected = {};          // dimension_id -> Set(tag_value_id)

// ---------- AUTH ----------

$('signInBtn').addEventListener('click', signIn);
$('password').addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); });

async function signIn() {
  $('authError').textContent = '';
  const { error } = await db.auth.signInWithPassword({
    email: $('email').value.trim(), password: $('password').value
  });
  if (error) { $('authError').textContent = error.message; return; }
  await verifyAdmin();
}

async function checkSession() {
  const { data: { session } } = await db.auth.getSession();
  if (session) await verifyAdmin();
}

async function verifyAdmin() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) return;
  const { data: p } = await db.from('profiles').select('role').eq('id', user.id).single();
  if (!p || !['owner','admin'].includes(p.role)) {
    $('authError').textContent = 'This account does not have admin access.';
    await db.auth.signOut(); return;
  }
  $('authView').classList.add('hidden');
  $('tagView').classList.remove('hidden');
  await loadDimensions();
  await loadModules();
  updateGlobalCounter();
}

// ---------- LOADERS ----------

async function loadDimensions() {
  const { data: dims } = await db.from('tag_dimensions')
    .select('id, name, allows_multiple, display_order').order('display_order');
  const { data: vals } = await db.from('tag_values')
    .select('id, dimension_id, value, display_order').order('display_order');
  dimensions = (dims || []).map(d => ({
    ...d, values: (vals || []).filter(v => v.dimension_id === d.id)
  }));
}

async function loadModules() {
  const { data } = await db.from('lsac_modules')
    .select('module_id, module_name, item_count').order('module_name');
  const sel = $('moduleSelect');
  sel.innerHTML = '<option value="">Choose a module…</option>';
  (data || []).forEach(m => {
    const o = document.createElement('option');
    o.value = m.module_id;
    o.textContent = `${m.module_name} (${m.item_count})`;
    sel.appendChild(o);
  });
  const last = localStorage.getItem('vd_tag_module');
  if (last && [...sel.options].some(o => o.value === last)) {
    sel.value = last;
    loadModule(last);
  }
}

$('moduleSelect').addEventListener('change', e => {
  e.target.blur();
  if (e.target.value) { localStorage.setItem('vd_tag_module', e.target.value); loadModule(e.target.value); }
});
$('sectionSelect').addEventListener('change', e => { e.target.blur(); updateSecTypeButtons(); });
$('advanceSelect').addEventListener('change', e => e.target.blur());
[...document.querySelectorAll('#secTypeButtons .chip')].forEach(b =>
  b.addEventListener('click', () => setSectionType(b.dataset.type)));

async function loadModule(moduleId) {
  $('itemBox').innerHTML = '<p class="sub">Loading items…</p>';
  $('sidebar').innerHTML = '';
  $('dimensionsArea').innerHTML = '';
  const { data: its, error } = await db.from('lsac_items')
    .select('module_id, item_id, item_position, content')
    .eq('module_id', moduleId).order('item_position');
  if (error) { $('itemBox').innerHTML = `<p class="sub">Load failed: ${escapeHtml(error.message)}</p>`; return; }
  allModuleItems = its || [];

  const ids = allModuleItems.map(i => i.item_id);
  tagsByItem = {};
  for (let i = 0; i < ids.length; i += 200) {
    const { data: tags } = await db.from('item_tags')
      .select('item_id, tag_value_id').in('item_id', ids.slice(i, i + 200));
    (tags || []).forEach(t => {
      if (!tagsByItem[t.item_id]) tagsByItem[t.item_id] = new Set();
      tagsByItem[t.item_id].add(t.tag_value_id);
    });
  }

  allModuleItems.sort((a, b) =>
    (sectionOf(a) - sectionOf(b)) || ((a.item_position ?? 0) - (b.item_position ?? 0)));

  await loadSectionLabels(moduleId);
  buildSectionOptions();

  if (!allModuleItems.length) {
    $('itemBox').innerHTML = '<p class="sub">No items found in this module.</p>';
    updateModuleCounter();
    return;
  }

  // start on the first untagged question if there is one, otherwise the first question
  const firstUntagged = allModuleItems.findIndex(i => !isTagged(i.item_id));
  idx = firstUntagged === -1 ? 0 : firstUntagged;
  renderItem();
}

function sectionOf(item) {
  return Number(item.content?._vd?.sectionOrder ?? 1);
}

let sectionLabels = {};   // section_order -> 'LR' | 'RC' | 'Other'

async function loadSectionLabels(moduleId) {
  sectionLabels = {};
  const { data } = await db.from('module_sections')
    .select('section_order, section_type').eq('module_id', moduleId);
  (data || []).forEach(r => { sectionLabels[r.section_order] = r.section_type; });
}

function buildSectionOptions() {
  const sel = $('sectionSelect');
  const counts = {};
  allModuleItems.forEach(i => {
    const s = sectionOf(i);
    counts[s] = (counts[s] || 0) + 1;
  });
  const sections = Object.keys(counts).map(Number).sort((a, b) => a - b);
  const current = sel.value;
  sel.innerHTML = '<option value="">Label a section…</option>';
  if (sections.length > 1) {
    sections.forEach(s => {
      const o = document.createElement('option');
      o.value = s;
      const label = sectionLabels[s] ? ` · ${sectionLabels[s]}` : '';
      o.textContent = `Section ${s}${label} (${counts[s]} items)`;
      sel.appendChild(o);
    });
    if ([...sel.options].some(o => o.value === current)) sel.value = current;
    sel.style.display = '';
  } else {
    sel.style.display = 'none';
  }
  updateSecTypeButtons();
}

function updateSecTypeButtons() {
  const bar = $('secTypeButtons');
  const sec = $('sectionSelect').value;
  if (sec === '' || $('sectionSelect').style.display === 'none') {
    bar.classList.add('hidden');
    return;
  }
  bar.classList.remove('hidden');
  const currentType = sectionLabels[Number(sec)] ?? null;
  [...bar.querySelectorAll('.chip')].forEach(ch => {
    ch.classList.toggle('on', ch.dataset.type === currentType);
  });
}

async function setSectionType(type) {
  const moduleId = $('moduleSelect').value;
  const sec = Number($('sectionSelect').value);
  if (!moduleId || !sec) return;
  const { error } = await db.from('module_sections').upsert({
    module_id: moduleId, section_order: sec, section_type: type
  });
  if (error) { $('tagError').textContent = error.message; return; }
  sectionLabels[sec] = type;
  buildSectionOptions();
  buildSidebar();
}

function questionTypeDim() { return dimensions.find(d => d.name === 'question_type'); }

function isTagged(itemId) {
  const qt = questionTypeDim();
  if (!qt) return (tagsByItem[itemId] || new Set()).size > 0;
  const qtIds = new Set(qt.values.map(v => v.id));
  return [...(tagsByItem[itemId] || [])].some(id => qtIds.has(id));
}

function tagNamesFor(itemId) {
  const qt = questionTypeDim();
  if (!qt) return '';
  const set = tagsByItem[itemId] || new Set();
  return qt.values.filter(v => set.has(v.id)).map(v => v.value).join(' · ');
}

// ---------- SIDEBAR ----------

function buildSidebar() {
  const sb = $('sidebar');
  sb.innerHTML = '';
  if (!allModuleItems.length) return;
  const multiSec = new Set(allModuleItems.map(sectionOf)).size > 1;
  let lastSec = null;
  allModuleItems.forEach((it, i) => {
    const s = sectionOf(it);
    if (multiSec && s !== lastSec) {
      lastSec = s;
      const h = document.createElement('div');
      h.className = 'sside-h';
      h.textContent = `Section ${s}${sectionLabels[s] ? ' · ' + sectionLabels[s] : ''}`;
      sb.appendChild(h);
    }
    const tagged = isTagged(it.item_id);
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'srow' + (tagged ? ' tagged' : '') + (i === idx ? ' current' : '');
    row.title = `Item ${it.item_id}`;

    const dot = document.createElement('span'); dot.className = 'sdot';
    const num = document.createElement('span'); num.className = 'snum';
    num.textContent = it.item_position ?? (i + 1);
    const tags = document.createElement('span'); tags.className = 'stags';
    tags.textContent = tagged ? (tagNamesFor(it.item_id) || 'tagged') : 'untagged';

    row.append(dot, num, tags);
    row.addEventListener('click', () => { idx = i; renderItem(); row.blur(); });
    sb.appendChild(row);
  });
  sb.querySelector('.srow.current')?.scrollIntoView({ block: 'nearest' });
}

// ---------- RENDER ----------

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderContentValue(v) {
  if (v === null || v === undefined) return '';
  return String(v);
}

function extractOptions(content) {
  const raw = content.options;
  if (!raw) return null;
  const letters = ['A','B','C','D','E','F'];
  if (Array.isArray(raw)) {
    return raw.map((o, i) => {
      if (typeof o === 'string') return { letter: letters[i], text: o };
      if (o && typeof o === 'object') {
        const text = o.text ?? o.optionText ?? o.optionContent ?? o.value ?? o.content ?? o.html ?? null;
        const letter = o.letter ?? o.optionLetter ?? o.label ?? letters[i];
        if (text !== null) return { letter, text: String(text) };
        return { letter: letters[i], text: JSON.stringify(o) };
      }
      return { letter: letters[i], text: String(o) };
    });
  }
  if (typeof raw === 'object') {
    return Object.entries(raw).map(([k, v]) => ({ letter: k, text: String(v) }));
  }
  return null;
}

function renderItem() {
  const it = allModuleItems[idx];
  const c = it.content || {};
  const opts = extractOptions(c);

  let html = `<div class="itemmeta">Item ${escapeHtml(it.item_id)} · section ${sectionOf(it)}${sectionLabels[sectionOf(it)] ? ' · ' + sectionLabels[sectionOf(it)] : ''} · position ${it.item_position ?? '—'} · ${isTagged(it.item_id) ? 'tagged' : 'untagged'}</div>`;

  const stim = renderContentValue(c.stimulusText);
  const stem = renderContentValue(c.stemText);

  if (stim) html += `<div class="stim">${stim}</div>`;
  if (stem) html += `<div class="stem">${stem}</div>`;
  if (opts) {
    html += opts.map(o =>
      `<div class="opt"><span class="letter">${escapeHtml(o.letter)}</span><span>${o.text}</span></div>`
    ).join('');
  }
  if (!stim && !stem && !opts) {
    html += `<p class="sub">Unrecognized item structure — raw fields below. Tell Claude which fields hold the text (field names only).</p>
             <div class="rawfallback">${escapeHtml(Object.keys(c).join(', '))}</div>`;
  }
  $('itemBox').innerHTML = html;

  selected = {};
  const existing = tagsByItem[it.item_id] || new Set();
  dimensions.forEach(d => {
    selected[d.id] = new Set(d.values.filter(v => existing.has(v.id)).map(v => v.id));
  });
  buildSidebar();
  renderDimensions();
  updateModuleCounter();
}

function renderDimensions() {
  const area = $('dimensionsArea');
  area.innerHTML = '';
  dimensions.forEach(d => {
    const lbl = document.createElement('div');
    lbl.className = 'dimlabel';
    lbl.innerHTML = `${escapeHtml(prettyName(d.name))} <span>· ${d.allows_multiple ? 'pick any' : 'pick one'}</span>`;
    area.appendChild(lbl);

    const chips = document.createElement('div');
    chips.className = 'chips';
    d.values.forEach(v => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (selected[d.id].has(v.id) ? ' on' : '');
      chip.textContent = v.value;
      chip.addEventListener('click', () => toggleChip(d, v, chip, chips));
      chips.appendChild(chip);
    });
    const add = document.createElement('button');
    add.type = 'button';
    add.className = 'chip addnew';
    add.textContent = '+ New';
    add.addEventListener('click', () => addValue(d));
    chips.appendChild(add);
    area.appendChild(chips);
  });
}

function prettyName(n) {
  return n.replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());
}

function toggleChip(d, v, chip, container) {
  if (d.allows_multiple) {
    if (selected[d.id].has(v.id)) { selected[d.id].delete(v.id); chip.classList.remove('on'); }
    else { selected[d.id].add(v.id); chip.classList.add('on'); }
  } else {
    selected[d.id] = selected[d.id].has(v.id) ? new Set() : new Set([v.id]);
    [...container.querySelectorAll('.chip')].forEach(c => c.classList.remove('on'));
    if (selected[d.id].size) chip.classList.add('on');
  }
  chip.blur();
}

async function addValue(d) {
  const value = prompt(`New value for ${prettyName(d.name)}:`);
  if (!value || !value.trim()) return;
  const { data, error } = await db.from('tag_values')
    .insert({ dimension_id: d.id, value: value.trim(), display_order: d.values.length + 1 })
    .select().single();
  if (error) { $('tagError').textContent = error.message; return; }
  d.values.push(data);
  renderDimensions();
}

// ---------- SAVE / NAVIGATE ----------

$('saveBtn').addEventListener('click', e => { e.currentTarget.blur(); saveAndNext(); });
$('skipBtn').addEventListener('click', e => { e.currentTarget.blur(); move(1); });
$('prevBtn').addEventListener('click', e => { e.currentTarget.blur(); move(-1); });

document.addEventListener('keydown', e => {
  if ($('tagView').classList.contains('hidden')) return;
  if (['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key === 'Enter') {
    if (document.activeElement.tagName === 'BUTTON') return;
    e.preventDefault(); saveAndNext();
  }
  else if (e.key === 'ArrowRight') { e.preventDefault(); move(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); move(-1); }
  else if (/^[1-5]$/.test(e.key)) {
    const dif = dimensions.find(d => d.name === 'difficulty');
    if (!dif) return;
    const v = dif.values.find(x => x.value === e.key);
    if (!v) return;
    selected[dif.id] = new Set([v.id]);
    renderDimensions();
  }
});

async function saveAndNext() {
  if (!allModuleItems.length) return;
  $('tagError').textContent = '';
  const it = allModuleItems[idx];
  const chosen = dimensions.flatMap(d => [...selected[d.id]]);

  const { error: delErr } = await db.from('item_tags').delete().eq('item_id', it.item_id);
  if (delErr) { $('tagError').textContent = delErr.message; return; }

  if (chosen.length) {
    const rows = chosen.map(id => ({ item_id: it.item_id, tag_value_id: id }));
    const { error: insErr } = await db.from('item_tags').insert(rows);
    if (insErr) { $('tagError').textContent = insErr.message; return; }
  }

  tagsByItem[it.item_id] = new Set(chosen);
  flashSaved('Saved');
  updateGlobalCounter();

  if ($('advanceSelect').value === 'untagged') {
    // next untagged after the current one, wrapping around to the start
    let next = -1;
    for (let i = idx + 1; i < allModuleItems.length; i++) {
      if (!isTagged(allModuleItems[i].item_id)) { next = i; break; }
    }
    if (next === -1) {
      for (let i = 0; i < idx; i++) {
        if (!isTagged(allModuleItems[i].item_id)) { next = i; break; }
      }
    }
    if (next === -1) {
      flashSaved('Saved · all questions tagged');
      renderItem();  // stay put, refresh sidebar and status line
      return;
    }
    idx = next;
    renderItem();
  } else {
    if (idx + 1 < allModuleItems.length) { idx++; renderItem(); }
    else { flashSaved('Saved · end of module'); renderItem(); }
  }
}

function move(step) {
  if (!allModuleItems.length) return;
  const next = idx + step;
  if (next < 0 || next >= allModuleItems.length) return;
  idx = next;
  renderItem();
}

function flashSaved(msg) {
  const f = $('savedFlash');
  f.textContent = msg || 'Saved';
  f.classList.remove('hidden');
  setTimeout(() => f.classList.add('hidden'), 1400);
}

// ---------- COUNTERS ----------

function updateModuleCounter() {
  const tagged = allModuleItems.filter(i => isTagged(i.item_id)).length;
  const pos = allModuleItems.length ? `Item ${idx + 1} of ${allModuleItems.length} · ` : '';
  $('moduleCounter').textContent = `${pos}${tagged}/${allModuleItems.length} tagged`;
}

async function updateGlobalCounter() {
  const { count } = await db.from('item_tags').select('*', { count: 'exact', head: true });
  $('globalCounter').textContent = `${count ?? 0} tags applied overall`;
}

checkSession();
</script>
