<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password — VEDARION</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #0A0A0A;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #fff;
        }
        .nav { display: flex; justify-content: space-between; align-items: center; padding: 30px 50px; }
        .nav-brand { font-size: 24px; font-weight: 300; letter-spacing: 4px; color: white; text-decoration: none; }
        .nav-brand .v-accent { color: #C65D3B; font-weight: 700; }
        .nav-links { display: flex; gap: 40px; }
        .nav-links a { color: #888; text-decoration: none; font-size: 14px; letter-spacing: 1px; transition: color 0.3s ease; }
        .nav-links a:hover { color: white; }
        .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .auth-card { width: 100%; max-width: 420px; }
        .auth-card h1 { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; letter-spacing: 2px; margin-bottom: 8px; }
        .auth-card .subtitle { color: #666; font-size: 14px; letter-spacing: 0.5px; margin-bottom: 40px; }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #888; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 14px 16px; background: #111; border: 1px solid #222; color: #fff; font-size: 15px; outline: none; transition: border-color 0.3s ease; }
        .form-group input:focus { border-color: #C65D3B; }
        .form-group input::placeholder { color: #444; }
        .submit-btn { width: 100%; padding: 16px; background: #C65D3B; color: white; border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: background 0.3s ease; margin-top: 8px; }
        .submit-btn:hover { background: #A04D2E; }
        .submit-btn:disabled { background: #333; cursor: not-allowed; }
        .auth-footer { text-align: center; margin-top: 30px; font-size: 14px; color: #666; }
        .auth-footer a { color: #C65D3B; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }
        .error-msg { background: rgba(198,93,59,0.1); border: 1px solid rgba(198,93,59,0.3); color: #C65D3B; padding: 12px 16px; font-size: 13px; margin-bottom: 20px; display: none; }
        .success-msg { background: rgba(59,198,93,0.1); border: 1px solid rgba(59,198,93,0.3); color: #3bc65d; padding: 12px 16px; font-size: 13px; margin-bottom: 20px; display: none; }
        .waiting { color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html" class="nav-brand"><span class="v-accent">V</span>EDARION</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Sign In</a>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>Set New Password</h1>
            <p class="subtitle">Choose a new password for your account.</p>
            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg"></div>
            <p class="waiting" id="waitingMsg">Verifying your reset link…</p>
            <form id="setForm" style="display:none;">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPass" placeholder="At least 8 characters" autocomplete="new-password" required>
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="newPass2" autocomplete="new-password" required>
                </div>
                <button type="submit" class="submit-btn" id="setBtn">Set New Password</button>
            </form>
            <div class="auth-footer" id="footerLinks" style="display:none;">
                Link expired? <a href="reset-password.html">Request a new one</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script>
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const waitingMsg = document.getElementById('waitingMsg');
        const setForm = document.getElementById('setForm');
        const setBtn = document.getElementById('setBtn');
        const footerLinks = document.getElementById('footerLinks');

        function showForm() {
            waitingMsg.style.display = 'none';
            setForm.style.display = 'block';
        }

        function showError(text) {
            waitingMsg.style.display = 'none';
            errorMsg.textContent = text;
            errorMsg.style.display = 'block';
            footerLinks.style.display = 'block';
        }

        vedarionAuth.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
                showForm();
            }
        });

        (async () => {
            const params = new URLSearchParams(window.location.hash.slice(1));
            if (params.get('error_description')) {
                showError(params.get('error_description').replace(/\+/g, ' ') + '.');
                return;
            }
            const { data: { session } } = await vedarionAuth.auth.getSession();
            if (session) showForm();
            else setTimeout(() => {
                if (setForm.style.display === 'none' && errorMsg.style.display === 'none') {
                    showError('This page only works from a password reset email link.');
                }
            }, 2500);
        })();

        setForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            const p1 = document.getElementById('newPass').value;
            const p2 = document.getElementById('newPass2').value;
            if (p1.length < 8) { errorMsg.textContent = 'Password must be at least 8 characters.'; errorMsg.style.display = 'block'; return; }
            if (p1 !== p2) { errorMsg.textContent = 'Passwords do not match.'; errorMsg.style.display = 'block'; return; }
            setBtn.disabled = true;
            setBtn.textContent = 'SAVING...';
            const { error } = await vedarionAuth.auth.updateUser({ password: p1 });
            setBtn.disabled = false;
            setBtn.textContent = 'SET NEW PASSWORD';
            if (error) { errorMsg.textContent = error.message; errorMsg.style.display = 'block'; return; }
            successMsg.innerHTML = 'Password updated. <a href="login.html" style="color:#3bc65d;">Sign in</a> with your new password.';
            successMsg.style.display = 'block';
            setForm.style.display = 'none';
        });
    </script>
</body>
</html>
