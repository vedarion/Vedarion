<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Up the Sufficient - VEDARION</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; background: #FAFAFA; color: #0A0A0A; min-height: 100vh; }
        .nav { background: #0A0A0A; display: flex; justify-content: space-between; align-items: center; padding: 25px 50px; border-bottom: 1px solid #222; }
        .nav-brand { font-size: 24px; font-weight: 300; letter-spacing: 4px; color: white; text-decoration: none; }
        .nav-brand .v-accent { color: #C65D3B; font-weight: 700; }
        .nav-links { display: flex; gap: 40px; }
        .nav-links a { color: #888; text-decoration: none; font-size: 14px; letter-spacing: 1px; transition: color 0.3s ease; }
        .nav-links a:hover, .nav-links a.active { color: white; }

        .hero { background: #0A0A0A; padding: 40px 20px 50px; text-align: center; border-bottom: 1px solid #222; }
        .page-title { font-size: 28px; font-weight: 400; letter-spacing: 4px; margin-bottom: 15px; color: white; }
        .page-subtitle { color: #666; font-size: 15px; }

        .prereq-wrapper { background: #0A0A0A; padding: 0 20px 16px; display: flex; justify-content: center; }
        .prereq-box { max-width: 360px; width: 100%; }
        .prereq-toggle { background: #1A1A1A; border: 1px solid #333; color: #999; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; padding: 10px 16px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; width: 100%; transition: all 0.3s; }
        .prereq-toggle:hover { border-color: #555; color: #ccc; }
        .prereq-toggle .arrow { font-size: 10px; transition: transform 0.3s; }
        .prereq-toggle.open .arrow { transform: rotate(180deg); }
        .prereq-panel { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; background: #1A1A1A; border: 1px solid #333; border-top: none; }
        .prereq-panel.open { max-height: 200px; }
        .prereq-panel a { display: block; padding: 12px 16px; color: #C65D3B; text-decoration: none; font-size: 13px; font-weight: 500; transition: all 0.2s; border-bottom: 1px solid #222; }
        .prereq-panel a:last-child { border-bottom: none; }
        .prereq-panel a:hover { background: #222; color: #E07050; }
        .prereq-panel a span { color: #666; font-weight: 400; margin-left: 6px; }

        .tab-nav { background: #0A0A0A; display: flex; justify-content: center; border-bottom: 1px solid #222; }
        .tab-btn { background: none; border: none; color: #666; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; padding: 16px 30px; cursor: pointer; transition: all 0.3s ease; border-bottom: 2px solid transparent; }
        .tab-btn:hover { color: #CCC; }
        .tab-btn.active { color: white; border-bottom-color: #C65D3B; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .video-section { background: #FAFAFA; padding: 40px 20px; }
        .video-container { max-width: 700px; margin: 0 auto; }
        .group-header { text-align: center; margin-bottom: 25px; }
        .group-title { font-size: 18px; font-weight: 600; letter-spacing: 1px; margin-bottom: 6px; }
        .group-subtitle { color: #888; font-size: 13px; }

        .back-link { display: inline-block; margin-top: 30px; color: #888; text-decoration: none; font-size: 13px; letter-spacing: 0.5px; transition: color 0.3s ease; }
        .back-link:hover { color: #C65D3B; }

        .footer { background: #0A0A0A; border-top: 1px solid #222; color: #555; text-align: center; padding: 30px 20px; font-size: 13px; }
        .footer a { color: #C65D3B; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }

        @media (max-width: 650px) {
            .nav { padding: 20px; flex-direction: column; gap: 20px; }
            .nav-links { gap: 25px; }
            .page-title { font-size: 22px; }
            .tab-btn { padding: 14px 16px; font-size: 10px; }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="../../index.html" class="nav-brand"><span class="v-accent">V</span>EDARION</a>
        <div class="nav-links">
            <a href="../../about.html">About</a>
            <a href="../../pricing.html">Pricing</a>
            <a href="../../learn.html" class="active">Learn</a>
            <a href="../../index.html#testimonials">Testimonials</a>
        </div>
    </nav>

    <section class="hero">
        <h1 class="page-title">Tactic: Line Up the Sufficient</h1>
    </section>

    <div class="prereq-wrapper">
        <div class="prereq-box">
            <button class="prereq-toggle" id="prereq-toggle">
                Related lessons
                <span class="arrow">▾</span>
            </button>
            <div class="prereq-panel" id="prereq-panel">
                <a href="../../foundations/conditional-logic/lesson.html?step=2">The Contrapositive <span>Foundations: Conditional Logic</span></a>
                <a href="lesson.html">Shared Sufficient <span>Lesson</span></a>
            </div>
        </div>
    </div>

    <div class="tab-nav">
        <button class="tab-btn active" data-tab="lesson">Tactic</button>
    </div>

    <div class="tab-content active" data-tab="lesson">
        <section class="video-section">
            <div class="video-container">
                <div style="position:relative;padding-top:56.25%;"><iframe src="https://player.mediadelivery.net/embed/600986/eef300cd-3bf8-4d1b-8aff-376de80e1f02?autoplay=false&loop=false&muted=false&preload=true&responsive=true" loading="lazy" style="border:0;position:absolute;top:0;height:100%;width:100%;" allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture;fullscreen;" allowfullscreen="true"></iframe></div>
                <div style="text-align:center;"><a href="../../learn.html" class="back-link">Back to Learn</a></div>
            </div>
        </section>
    </div>

    <footer class="footer">
        <p>Questions? <a href="mailto:vedarion.tutoring@gmail.com">vedarion.tutoring@gmail.com</a></p>
    </footer>

    <script>
        document.querySelectorAll('.tab-btn[data-tab]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
                document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
                btn.classList.add('active');
                document.querySelector('.tab-content[data-tab="' + btn.dataset.tab + '"]').classList.add('active');
            });
        });

        document.getElementById('prereq-toggle').addEventListener('click', function() {
            this.classList.toggle('open');
            document.getElementById('prereq-panel').classList.toggle('open');
        });
    </script>
</body>
</html>
