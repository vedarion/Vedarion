<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEDARION · Admin · Student review</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --cream: #FAF8F5; --cream-warm: #FDF5F1;
    --orange: #C65D3B; --orange-dark: #A34A2D;
    --ink: #2B2B2B; --ink-soft: #6B6560; --line: #E8E2DB;
    --green: #3E7A52; --red: #A33B3B;
    --hl-yellow: #FCE9A8; --hl-orange: #F8D3BC; --hl-blue: #CFE3F5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--cream); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; min-height: 100vh; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; border-bottom: 1px solid var(--line); background: #fff; }
  .logo { font-family: Georgia, serif; font-size: 18px; letter-spacing: 1px; }
  .logo .v { color: var(--orange); }
  .logo .crumb { color: var(--ink-soft); font-family: -apple-system, sans-serif; font-size: 13px; letter-spacing: 0; margin-left: 10px; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 26px 20px 90px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 22px; margin-bottom: 16px; }
  h1 { font-family: Georgia, serif; font-size: 22px; font-weight: 500; margin-bottom: 6px; }
  h2 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .sub { color: var(--ink-soft); font-size: 14px; line-height: 1.6; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
  input[type=email], input[type=password] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; background: var(--cream); }
  select { padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; background: #fff; }
  input:focus, select:focus { outline: 2px solid var(--orange); outline-offset: 1px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 8px; border: 1px solid var(--orange); background: var(--orange); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: var(--orange-dark); }
  .hidden { display: none; }
  #authError { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 18px; }
  .statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .stat { background: var(--cream); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat .k { font-size: 11px; letter-spacing: 1px; color: var(--ink-soft); text-transform: uppercase; }
  .stat .v { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .stat .v.flag { color: var(--orange-dark); }
  .typerow { display: flex; align-items: center; gap: 10px; padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .typerow .name { width: 190px; }
  .typerow .bar { flex: 1; height: 7px; background: var(--cream); border-radius: 4px; overflow: hidden; }
  .typerow .bar > div { height: 100%; background: var(--orange); }
  .typerow .pct { width: 90px; text-align: right; color: var(--ink-soft); }
  .drill { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .drillhead { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; cursor: pointer; background: #fff; }
  .drillhead:hover { background: var(--cream-warm); }
  .drillhead .meta { font-size: 12px; color: var(--ink-soft); }
  .drillhead .gohint { font-size: 12px; color: var(--ink-soft); opacity: 0; margin-left: 6px; transition: opacity 0.12s; }
  .drillhead:hover .gohint { opacity: 1; color: var(--orange-dark); }
  .score { font-weight: 600; }
  .pill { font-size: 11px; padding: 3px 10px; border-radius: 12px; border: 1px solid var(--line); color: var(--ink-soft); margin-left: 8px; }
  .pill.completed { border-color: var(--green); color: var(--green); }
  .pill.in_progress { border-color: var(--orange); color: var(--orange-dark); }
  .qtable { border-top: 1px solid var(--line); background: var(--cream); padding: 8px 14px 12px; }
  .qrow { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .qrow:last-child { border-bottom: none; }
  .qrow .pos { width: 34px; color: var(--ink-soft); }
  .qrow .res { width: 84px; }
  .qrow .res.ok { color: var(--green); }
  .qrow .res.bad { color: var(--red); }
  .qrow .ans { width: 110px; color: var(--ink-soft); }
  .qrow .time { width: 60px; color: var(--ink-soft); }
  .qrow .flagmark { width: 20px; color: var(--orange-dark); }
  .viewbtn { margin-left: auto; font-size: 12px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; }
  .viewbtn:hover { border-color: var(--orange); }
  /* question viewer modal */
  #overlay { position: fixed; inset: 0; background: rgba(30,25,20,0.45); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 20; }
  #overlay.hidden { display: none; } /* FIX: ID selector was beating .hidden, so the empty modal covered the page on load */
  #qview { background: #fff; border-radius: 12px; max-width: 700px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 24px; }
  #qview .qmeta { font-size: 12px; color: var(--ink-soft); margin-bottom: 12px; }
  #qview .stim { font-size: 15px; line-height: 1.8; background: var(--cream); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  #qview .stem { font-weight: 600; margin-bottom: 12px; }
  mark { border-radius: 2px; padding: 0 1px; }
  mark.hl-y { background: var(--hl-yellow); } mark.hl-o { background: var(--hl-orange); } mark.hl-b { background: var(--hl-blue); }
  .vopt { display: flex; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 7px; font-size: 14px; line-height: 1.5; }
  .vopt .letter { font-weight: 700; color: var(--orange-dark); min-width: 16px; }
  .vopt.elim { opacity: 0.4; text-decoration: line-through; }
  .vopt.pickedwrong { border-color: var(--red); background: #FAEDED; }
  .vopt.correct { border-color: var(--green); background: #EDF5EF; }
  .legend { font-size: 12px; color: var(--ink-soft); margin-bottom: 12px; }
  .closebtn { float: right; font-size: 13px; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 5px 14px; cursor: pointer; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><span class="v">V</span>EDARION<span class="crumb">/ admin / student review</span></div>
</div>

<div class="wrap">

  <div id="authView" class="card" style="max-width: 440px; margin: 50px auto;">
    <h1>Sign in</h1>
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username">
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password">
    <div id="authError"></div>
    <button class="btn" id="signInBtn" style="margin-top:14px;">Sign in</button>
  </div>

  <div id="reviewView" class="hidden">

    <div class="card" style="display:flex; align-items:center; gap:14px;">
      <label for="studentSelect" style="margin:0;">Student</label>
      <select id="studentSelect"></select>
      <span class="sub" id="loadState"></span>
    </div>

    <div class="card">
      <div class="statgrid">
        <div class="stat"><div class="k">Drills completed</div><div class="v" id="stCompleted">—</div></div>
        <div class="stat"><div class="k">Questions answered</div><div class="v" id="stAnswered">—</div></div>
        <div class="stat"><div class="k">Overall accuracy</div><div class="v" id="stAccuracy">—</div></div>
        <div class="stat"><div class="k">Flagged for session</div><div class="v flag" id="stFlagged">—</div></div>
      </div>
    </div>

    <div class="card">
      <h2>Accuracy by question type</h2>
      <div id="typeRows"><p class="sub">Pick a student.</p></div>
    </div>

    <div class="card">
      <h2>Drills</h2>
      <div id="drillArea"><p class="sub">Pick a student.</p></div>
    </div>

  </div>
</div>

<div id="overlay" class="hidden">
  <div id="qview"></div>
</div>

<script>
const SUPABASE_URL = 'https://fqshijwiushtrncinjif.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxc2hpandpdXNodHJuY2luamlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5MzIwMDcsImV4cCI6MjA4NjUwODAwN30.tkPgY4oGhjQLzl81MVDG0a1PhjCgcGMQ6HBD0UOPruA';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

let drills = [];          // student's drills
let responsesByDrill = {};// drill_id -> [responses]
let itemsByDrill = {};    // drill_id -> [drill_items]
let qtypeByItem = {};     // item_id -> question type value
let answersByKey = {};    // module|item -> correct answer
let contentByKey = {};    // module|item -> content (loaded on demand)

$('signInBtn').addEventListener('click', signIn);
$('password').addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); });

async function signIn() {
  $('authError').textContent = '';
  const { error } = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (error) { $('authError').textContent = error.message; return; }
  await verifyAdmin();
}

async function checkSession() {
  const { data: { session } } = await db.auth.getSession();
  if (session) await verifyAdmin();
}

async function verifyAdmin() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) return;
  const { data: p } = await db.from('profiles').select('role').eq('id', user.id).single();
  if (!p || !['owner','admin'].includes(p.role)) {
    $('authError').textContent = 'Admin access required.';
    await db.auth.signOut(); return;
  }
  $('authView').classList.add('hidden');
  $('reviewView').classList.remove('hidden');
  await loadStudents();
}

async function loadStudents() {
  const { data } = await db.from('students')
    .select('id, profiles:profile_id ( first_name, email )').order('created_at');
  const sel = $('studentSelect');
  sel.innerHTML = '<option value="">Choose…</option>';
  (data || []).forEach(s => {
    const o = document.createElement('option');
    o.value = s.id;
    o.textContent = s.profiles?.first_name || s.profiles?.email || s.id.slice(0,8);
    sel.appendChild(o);
  });
  sel.addEventListener('change', () => { if (sel.value) loadStudent(sel.value); });

  // Deep link: admin-review.html?student=<students.id> auto-selects and loads that student
  const preselect = new URLSearchParams(window.location.search).get('student');
  if (preselect) {
    sel.value = preselect;
    if (sel.value === preselect) {
      loadStudent(preselect);
    } else {
      sel.value = '';
      $('loadState').textContent = 'Student not found — pick one from the list.';
    }
  }
}

let currentStudentId = null;

async function loadStudent(studentId) {
  currentStudentId = studentId;
  $('loadState').textContent = 'Loading…';

  const { data: ds } = await db.from('drills')
    .select('id, title, question_count, status, created_by, is_timed, reveal_answers, created_at, completed_at')
    .eq('student_id', studentId).order('created_at', { ascending: false });
  drills = ds || [];

  const drillIds = drills.map(d => d.id);
  responsesByDrill = {}; itemsByDrill = {};
  if (drillIds.length) {
    for (let i = 0; i < drillIds.length; i += 50) {
      const slice = drillIds.slice(i, i + 50);
      const { data: rs } = await db.from('drill_responses')
        .select('drill_id, module_id, item_id, selected_answer, is_correct, time_spent_seconds, flagged, annotations, answered_at')
        .in('drill_id', slice);
      (rs || []).forEach(r => { (responsesByDrill[r.drill_id] = responsesByDrill[r.drill_id] || []).push(r); });
      const { data: its } = await db.from('drill_items')
        .select('drill_id, module_id, item_id, position').in('drill_id', slice);
      (its || []).forEach(it => { (itemsByDrill[it.drill_id] = itemsByDrill[it.drill_id] || []).push(it); });
    }
  }

  // question types for all involved items
  const allItemIds = [...new Set(Object.values(itemsByDrill).flat().map(i => i.item_id))];
  qtypeByItem = {};
  for (let i = 0; i < allItemIds.length; i += 200) {
    const { data: tags } = await db.from('item_tags')
      .select('item_id, tag_values ( value, tag_dimensions ( name ) )')
      .in('item_id', allItemIds.slice(i, i + 200));
    (tags || []).forEach(t => {
      if (t.tag_values?.tag_dimensions?.name === 'question_type') qtypeByItem[t.item_id] = t.tag_values.value;
    });
  }

  // correct answers (admin-only table)
  answersByKey = {};
  const keyPairs = [...new Set(Object.values(itemsByDrill).flat().map(i => i.module_id + '|' + i.item_id))];
  const modIds = [...new Set(keyPairs.map(k => k.split('|')[0]))];
  for (let i = 0; i < modIds.length; i += 30) {
    const { data: ans } = await db.from('lsac_item_answers')
      .select('module_id, item_id, correct_answer').in('module_id', modIds.slice(i, i + 30));
    (ans || []).forEach(a => { answersByKey[a.module_id + '|' + a.item_id] = a.correct_answer; });
  }

  renderStats();
  renderTypeAccuracy();
  renderDrills();
  $('loadState').textContent = '';
}

function allResponses() { return Object.values(responsesByDrill).flat(); }

function renderStats() {
  const completed = drills.filter(d => d.status === 'completed').length;
  const resp = allResponses();
  const graded = resp.filter(r => r.is_correct !== null);
  const correct = graded.filter(r => r.is_correct).length;
  $('stCompleted').textContent = completed;
  $('stAnswered').textContent = resp.length;
  $('stAccuracy').textContent = graded.length ? Math.round(100 * correct / graded.length) + '%' : '—';
  $('stFlagged').textContent = resp.filter(r => r.flagged).length;
}

function renderTypeAccuracy() {
  const byType = {};
  allResponses().forEach(r => {
    const t = qtypeByItem[r.item_id];
    if (!t || r.is_correct === null) return;
    byType[t] = byType[t] || { n: 0, c: 0 };
    byType[t].n++;
    if (r.is_correct) byType[t].c++;
  });
  const box = $('typeRows');
  const types = Object.keys(byType).sort();
  if (!types.length) { box.innerHTML = '<p class="sub">No graded answers on tagged questions yet.</p>'; return; }
  box.innerHTML = '';
  types.forEach(t => {
    const { n, c } = byType[t];
    const pct = Math.round(100 * c / n);
    const row = document.createElement('div');
    row.className = 'typerow';
    row.innerHTML = `<span class="name">${escapeHtml(t)}</span>
      <span class="bar"><div style="width:${pct}%"></div></span>
      <span class="pct">${c}/${n} · ${pct}%</span>`;
    box.appendChild(row);
  });
}

function renderDrills() {
  const box = $('drillArea');
  if (!drills.length) { box.innerHTML = '<p class="sub">No drills yet.</p>'; return; }
  box.innerHTML = '';
  drills.forEach(d => {
    const resp = responsesByDrill[d.id] || [];
    const graded = resp.filter(r => r.is_correct !== null);
    const correct = graded.filter(r => r.is_correct).length;
    const flags = resp.filter(r => r.flagged).length;
    const when = new Date(d.created_at).toLocaleDateString();

    const wrap = document.createElement('div');
    wrap.className = 'drill';
    const head = document.createElement('div');
    head.className = 'drillhead';
    head.innerHTML = `
      <div>
        <div>${escapeHtml(d.title)} · ${d.question_count} questions${d.is_timed ? ' · timed' : ''} <span class="gohint">open review →</span></div>
        <div class="meta">${d.created_by === 'student' ? 'Self-created' : 'Assigned'} · ${when}${flags ? ` · <span style="color:var(--orange-dark)">${flags} flagged ⚑</span>` : ''}</div>
      </div>
      <div style="display:flex; align-items:center;">
        <span class="score">${graded.length ? `${correct}/${graded.length}` : '—'}</span>
        <span class="pill ${d.status}">${d.status.replace('_',' ')}</span>
        <button class="viewbtn quickbtn" style="margin-left:10px;">Quick view ▾</button>
      </div>`;
    const body = document.createElement('div');
    body.className = 'qtable hidden';
    // Clicking the drill opens the full drill review (questions, picks, worksheets) in drills.html
    head.addEventListener('click', () => {
      window.open(`drills.html?student=${encodeURIComponent(currentStudentId)}&drill=${encodeURIComponent(d.id)}`, '_blank');
    });
    // Quick view toggles the inline stats table without leaving the page
    head.querySelector('.quickbtn').addEventListener('click', e => {
      e.stopPropagation();
      if (body.classList.contains('hidden')) {
        body.classList.remove('hidden');
        fillQuestions(d, body);
        e.target.textContent = 'Quick view ▴';
      } else {
        body.classList.add('hidden');
        e.target.textContent = 'Quick view ▾';
      }
    });
    wrap.appendChild(head); wrap.appendChild(body);
    box.appendChild(wrap);
  });
}

function fillQuestions(drill, container) {
  const items = (itemsByDrill[drill.id] || []).slice().sort((a, b) => a.position - b.position);
  const respMap = {};
  (responsesByDrill[drill.id] || []).forEach(r => { respMap[r.item_id] = r; });
  container.innerHTML = '';
  items.forEach(it => {
    const r = respMap[it.item_id];
    const correct = answersByKey[it.module_id + '|' + it.item_id];
    const row = document.createElement('div');
    row.className = 'qrow';
    let res = '—', resCls = '';
    if (r) { res = r.is_correct ? 'correct' : 'incorrect'; resCls = r.is_correct ? 'ok' : 'bad'; }
    row.innerHTML = `
      <span class="pos">${it.position}</span>
      <span class="res ${resCls}">${res}</span>
      <span class="ans">${r ? `${escapeHtml(r.selected_answer ?? '—')} · key ${escapeHtml(correct ?? '?')}` : ''}</span>
      <span class="time">${r?.time_spent_seconds != null ? r.time_spent_seconds + 's' : ''}</span>
      <span class="flagmark">${r?.flagged ? '⚑' : ''}</span>
      <span class="sub" style="flex:1;">${escapeHtml(qtypeByItem[it.item_id] || '')}</span>
      <button class="viewbtn">View question</button>`;
    row.querySelector('.viewbtn').addEventListener('click', () => openQuestion(it, r, correct));
    container.appendChild(row);
  });
  if (!items.length) container.innerHTML = '<p class="sub" style="padding:8px 0;">No items found.</p>';
}

// ---------- QUESTION VIEWER ----------

function extractOptions(content) {
  const raw = content?.options;
  if (!raw) return [];
  const letters = ['A','B','C','D','E','F'];
  if (Array.isArray(raw)) {
    return raw.map((o, i) => {
      if (typeof o === 'string') return { letter: letters[i], text: o };
      const text = o.optionContent ?? o.text ?? o.optionText ?? o.value ?? o.content ?? '';
      const letter = o.optionLetter ?? o.letter ?? o.label ?? letters[i];
      return { letter, text: String(text) };
    });
  }
  return Object.entries(raw).map(([k, v]) => ({ letter: k, text: String(v) }));
}

async function openQuestion(it, r, correct) {
  const key = it.module_id + '|' + it.item_id;
  if (!contentByKey[key]) {
    const { data } = await db.from('lsac_items')
      .select('content').eq('module_id', it.module_id).eq('item_id', it.item_id).single();
    contentByKey[key] = data?.content || {};
  }
  const c = contentByKey[key];
  const ann = r?.annotations || {};
  const stim = ann.highlightedStim ?? c.stimulusText ?? '';
  const stem = ann.highlightedStem ?? c.stemText ?? '';
  const eliminated = new Set(ann.eliminated || []);
  const opts = extractOptions(c);

  const v = $('qview');
  let html = `<button class="closebtn" id="closeQv">Close</button>
    <div class="qmeta">Item ${escapeHtml(it.item_id)} · ${escapeHtml(qtypeByItem[it.item_id] || 'untagged')}${r?.flagged ? ' · <span style="color:var(--orange-dark)">flagged by student ⚑</span>' : ''}</div>
    <div class="legend">Student's highlights shown in color · struck-through = eliminated by student · green = credited response${r && !r.is_correct ? ' · red = student\'s answer' : ''}</div>`;
  if (stim) html += `<div class="stim">${stim}</div>`;
  if (stem) html += `<div class="stem">${stem}</div>`;
  opts.forEach(o => {
    const cls = ['vopt'];
    if (eliminated.has(o.letter)) cls.push('elim');
    if (correct && o.letter === correct) cls.push('correct');
    if (r && !r.is_correct && o.letter === r.selected_answer) cls.push('pickedwrong');
    html += `<div class="${cls.join(' ')}"><span class="letter">${escapeHtml(o.letter)}</span><span>${o.text}</span></div>`;
  });
  v.innerHTML = html;
  $('overlay').classList.remove('hidden');
  document.getElementById('closeQv').addEventListener('click', () => $('overlay').classList.add('hidden'));
}

$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) $('overlay').classList.add('hidden'); });

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

checkSession();
</script>
</body>
</html>
